<!doctype html>
<meta charset="utf-8">
<title>ADHDme: the front door to ADHD care</title>
<style>
  /* core.js lists "Bradley Hand" first in HAND_FONT. Registering Caveat (OFL, fonts/OFL.txt) under that
     name makes every hand-lettered line render the same on every machine, headless or not. */
  @font-face { font-family: "Bradley Hand"; src: url("fonts/Caveat[wght].ttf"); font-weight: 100 900; }
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(92vw,960px);height:auto;background:#000;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="core.js"></script>
<script>
'use strict';
// ============================================================
// ADHDme, an explainer drawn frame by frame on Canvas 2D on top of core.js
// (hand-drawn-canvas-animation skill). No images, no libraries, no Math.random.
// ============================================================

// ===================== BRIEF & BEAT SHEET =====================
// BRIEF
// Subject: what ADHDme does, why it is hard to find a GP you click with, and the value prop
//          from the September 2026 strategic plan deck (problem, solution, assessment, fit loop,
//          patient value: transparent, fast, personal).
// Format: 16:9, output width 1920, drawn 12 fps, output 24 fps, 28.75 seconds.
//         Everything is placed relative to CX, CY, W, H so the same file renders 1:1 or 9:16.
// Look:   ink on warm paper (home look), one pencil page (the directory), two blueprint
//         interludes on navy (what ADHDme does, the fit loop). Cuts only on hard cuts.
// Palette: makePalette from the deck's brand system: paper #FBFAF7, ink #191A17, amber #8A5A16,
//         tint #E9D6B4, slate #5C6CB0. Paper warmed so stock grain shows; night is a slate navy.
// Finish: follows the palette (ink); pencil on the directory page.
// Anchor: Sam, the patient. In every shot, in chalk during the blueprint interludes,
//         waving under the sign-off.
// Puppets: one person builder (drawPerson) with looks: Sam (slate top, amber hair) and five GPs
//         (white coats, stethoscopes, different hair, skin and glasses). Pose: lean, arm, mood,
//         walk, nod, blink.
// Text:   this is an explainer, so each shot carries one short hand-lettered caption in two inks
//         (the deck's own lines), plus the labels a diagram needs. Everything else is drawn.
//
// t      dur   scene       look        camera    what changes                                        kit                                   sound
// 0.00   2.50  sam         ink         push-in   Sam on a hatched ground, thought bubble: a GP and ?  ground construction bubble scribble   slow plucks
// 2.50   2.00  directory   pencil      scroll    identical listings, same score stamp, ads, $ scrawl  squiggleText dashedRing thread        low sines
// 4.50   4.25  stuck       ink         static    Sam constant; tag with hidden price / four faceless  device T: world cuts at 1 s           a note per cut,
//                                                cards, same score / a door and a pill thought /      shape card bubble                     low note at "stop"
//                                                Sam walks away: people stop before the booking
// 8.75   2.75  frontdoor   ink->blue   static    ink blot to blueprint; ADHDme circle self-draws,     blot selfDraw dashedRing strokes      sawtooth swell,
//                                                three branches: find, compare, book                                                       rising notes
// 11.50  2.50  find        ink         static    Sam constant; five GP profile cards cut at 0.5 s,     device T card squiggleText seedDot   squares per card
//                                                filter chips, fit dots, scope icons
// 14.00  2.00  compare     ink         static    two cards, the full two-consult price, scope ticks,   card hand selfDraw                    plucks, bright tick
//                                                a crayon ring picks one, Sam points
// 16.00  1.75  book        ink         static    a calendar, two dates circled, both linked to one GP  card selfDraw dashed lines            two cues, arpeggio
// 17.75  2.50  assess      ink         push-in   Sam and the GP at a desk; cardiac, psychological,     ground shape strokes dashedRing      plucks, a note per icon
//                                                biomarkers appear on rings
// 20.25  2.50  loop        blueprint   iris      need, match, consult, rate, learn on a ring; a spark   iris dottedArc selfDraw aster         swell, rising fives
//                                                laps it faster the second time; stars crossed out
// 22.75  2.50  value       ink         static    three badges: tag, clock, pair; transparent, fast,    surface dashedRing strokes aster      three rising notes
//                                                personal; Sam and the GP together
// 25.25  2.00  tagline     ink         static    "The right ADHD doctor should not be hard to find."   ripples hand walk cycle               long dyad
// 27.25  1.50  signoff     ink         static    ADHDme / adhdme.au, two dots, Sam waves               signOff ripples                       dyad, 1 s release

// ===================== PALETTE =====================
const ADHDME = makePalette({
  paper: '#f7f1e6', paperBand: 'rgba(233,214,180,.38)', ink: '#1b1c19',
  night: '#1a2038', chalk: '#ebe7f7', chalkDim: '#8b93c6', guide: 'rgba(92,108,176,.55)',
  fills: ['#e9d6b4', '#8a5a16', '#5c6cb0', '#d9b078', '#bfc5e3', '#c99a5a'],
  shade: '#4a3512', light: '#fffaf0', blush: '#b0483a',
  accents: ['#5c6cb0', '#8a5a16', '#e0a63a', '#b0483a'],
  inks: ['#1b1c19', '#8a5a16', '#5c6cb0'], finish: 'ink',
}, 'paperInk');
const ADHDME_PENCIL = makePalette({ finish: 'pencil', paperBand: null }, ADHDME);
usePalette(ADHDME);

// ===================== HELPERS =====================
// points around a rounded rectangle, for wob / selfDraw outlines that must not coincide with the Path2D fill
function roundRectPts(x, y, w, h, r, n = 6) {
  const pts = [], corner = (cx, cy, a0) => { for (let k = 0; k <= n; k++) { const a = a0 + k / n * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
  corner(x + w - r, y + r, -Math.PI / 2); corner(x + w - r, y + h - r, 0); corner(x + r, y + h - r, Math.PI / 2); corner(x + r, y + r, Math.PI);
  return pts;
}
// hand lettering in two inks, like handText but with a weight (Caveat is a variable font)
function hand(c, text, x, y, o = {}) {
  const { size = 48, ink = PAL.ink, ink2 = PAL.accents[1], offset = 3, align = 'left', weight = 600, al = 1 } = o;
  if (!text) return;
  c.save(); c.font = `${weight} ${size}px ${HAND_FONT}`; c.textAlign = align; c.textBaseline = 'alphabetic';
  if (ink2) { c.fillStyle = ink2; c.globalAlpha = .85 * al; c.fillText(text, x + offset, y + offset * .6); }
  c.fillStyle = ink; c.globalAlpha = al; c.fillText(text, x, y); c.restore();
}
// one caption per shot, bottom left, screen coordinates; p < 1 types it out
function caption(c, text, o = {}) { const p = o.p ?? 1; resetT(c); hand(c, text.slice(0, Math.round(text.length * p)), o.x ?? W * .055, o.y ?? H * .91, { size: 54, ...o }); }
// fill -> finish -> wobbly outline, the whole ink pipeline for one shape
function shape(c, path, pts, box, fill, seed, o = {}) {
  c.fillStyle = fill; c.fill(path); surface(c, path, box, { seed, ...o });
  c.strokeStyle = o.line || PAL.ink; c.lineWidth = o.lw || (PAL.finish === 'pencil' ? 1.2 : 2.6); wob(c, pts, o.amp || 1.8, seed + 1, true);
}
// a paper card with a flat offset shadow
function card(c, x, y, w, h, seed, fill = PAL.light, r = 26) {
  c.fillStyle = alpha(PAL.ink, .10); c.fill(roundRectPath(x + 8, y + 10, w, h, r));
  shape(c, roundRectPath(x, y, w, h, r), roundRectPts(x, y, w, h, r), [x, y, w, h], fill, seed, { alpha: .12, gap: 7, grain: 60 });
}
// the hatched ground of the ink look: a huge circle whose rim is the horizon
const GROUND_R = 2600;
const groundY = (x, top, R = GROUND_R) => top + R - Math.sqrt(R * R - (x - CX) * (x - CX));
function ground(c, seed = 21, top = CY + 170) {
  const R = GROUND_R, cy = top + R, g = circPath(CX, cy, R), box = [0, top, W, H - top];
  c.fillStyle = PAL.fills[0]; c.fill(g);
  surface(c, g, box, { seed, color: PAL.light, density: .25, gap: 7, len: 18, alpha: .55, width: 1.4, grain: 0 });
  c.save(); c.clip(g); hatch(c, circPath(CX + 500, top + 700, 900), [CX - 400, top - 200, 1800, 1800], { angle: -.6, gap: 6, len: 20, jitter: 5, color: PAL.blush, alpha: .2, seed: seed + 1 }); c.restore();
  grain(c, g, box, 5000, PAL.shade, .3, seed + 2, 2);
  c.strokeStyle = PAL.ink; c.lineWidth = 3; c.globalAlpha = .85; wob(c, ellPts(CX, cy, R, R, 0, 400), 2.5, seed + 3, true); c.globalAlpha = 1;
}
// a thought bubble with a drawing inside, plus the trail of small circles from the head
function bubble(c, x, y, rx, ry, seed, draw, q = 1) {
  if (q <= 0) return; c.save(); c.translate(x, y); c.scale(q, q);
  const p = ellPath(0, 0, rx, ry); c.fillStyle = PAL.light; c.fill(p); surface(c, p, [-rx, -ry, 2 * rx, 2 * ry], { seed, alpha: .12, gap: 8, grain: 30 });
  c.strokeStyle = PAL.ink; c.lineWidth = 2.6; wob(c, ellPts(0, 0, rx, ry, 0, 60), 2, seed + 1, true);
  draw(c); c.restore();
}
function bubbleTrail(c, from, to, seed, q) {
  for (let k = 0; k < 3; k++) { const u = (k + 1) / 4, qq = sm(k * .12, k * .12 + .2, q); if (qq <= 0) continue; const x = lerp(from[0], to[0], u), y = lerp(from[1], to[1], u), r = (9 + k * 7) * qq;
    c.fillStyle = PAL.light; c.fill(circPath(x, y, r)); c.strokeStyle = PAL.ink; c.lineWidth = 2.2; wob(c, ellPts(x, y, r, r, 0, 16), 1.2, seed + k, true); }
}
// icons as lists of polylines, so selfDraw can draw them in; p is the progress across the whole list
function strokes(c, list, p, seed, amp = 1.2) {
  const base = c.lineWidth, lens = list.map(s => pathLength(s.pts, s.close)), total = lens.reduce((a, b) => a + b, 0); let acc = 0;
  list.forEach((s, k) => { const a = acc / total, b = (acc + lens[k]) / total; acc += lens[k]; const q = clamp((p - a) / (b - a), 0, 1); if (q <= 0) return; c.lineWidth = base * (s.w || 1); selfDraw(c, s.pts, q, seed + k, amp, s.close); });
  c.lineWidth = base;
}
const heartPts = (() => { const p = []; for (let k = 0; k < 48; k++) { const t = k / 48 * TAU; p.push([16 * Math.pow(Math.sin(t), 3) * 2.4, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 2.4 + 4]); } return p; })();
const dropPts = (() => { const p = []; for (let k = 0; k < 44; k++) { const a = k / 44 * TAU, bx = Math.cos(a) * 30, by = 14 + Math.sin(a) * 30, w = Math.pow(Math.max(0, -Math.sin(a)), 1.6) * .9; p.push([lerp(bx, 0, w), lerp(by, -50, w)]); } return p; })();
const headPts = [[4, -50], [-22, -44], [-40, -22], [-42, 4], [-34, 22], [-36, 34], [-24, 36], [-22, 50], [14, 50], [16, 30], [30, 26], [26, 12], [36, 6], [28, -4], [30, -22], [20, -42]];
const ICONS = {
  find: [{ pts: ellPts(-10, -10, 32, 32, 0, 40), close: true }, { pts: [[14, 14], [48, 48]], w: 1.8 }],
  compare: [{ pts: roundRectPts(-58, -42, 50, 84, 8), close: true }, { pts: roundRectPts(8, -42, 50, 84, 8), close: true }, { pts: [[-48, 22], [-18, 22]], w: 1.6 }, { pts: [[18, 22], [48, 22]], w: 1.6 }, { pts: [[-48, -20], [-30, -20]] }, { pts: [[18, -20], [36, -20]] }],
  book: [{ pts: roundRectPts(-48, -40, 96, 84, 8), close: true }, { pts: [[-48, -16], [48, -16]] }, { pts: [[-28, -54], [-28, -30]], w: 1.6 }, { pts: [[28, -54], [28, -30]], w: 1.6 }, { pts: [[-22, 12], [-8, 28], [26, -4]], w: 1.8 }],
  heart: [{ pts: heartPts, close: true }],
  head: [{ pts: headPts, close: true }, { pts: ellPts(-6, -8, 13, 13, 0, 14), close: true }],
  drop: [{ pts: dropPts, close: true }, { pts: [[-12, 14], [-8, 26]], w: .8 }],
  tag: [{ pts: [[-48, -30], [14, -30], [50, 0], [14, 30], [-48, 30]], close: true }, { pts: ellPts(-32, 0, 6, 6, 0, 10), close: true }],
  clock: [{ pts: ellPts(0, 0, 42, 42, 0, 40), close: true }, { pts: [[0, 0], [0, -28]], w: 1.5 }, { pts: [[0, 0], [20, 12]], w: 1.5 }, { pts: [[54, -34], [74, -34]] }, { pts: [[58, -12], [80, -12]] }, { pts: [[54, 10], [74, 10]] }],
  pair: [{ pts: ellPts(-24, -14, 15, 16, 0, 20), close: true }, { pts: ellPts(24, -14, 15, 16, 0, 20), close: true }, { pts: [[-52, 36], [-44, 10], [-24, 4], [-6, 10], [0, 28]] }, { pts: [[52, 36], [44, 10], [24, 4], [6, 10], [0, 28]] }],
  pill: [{ pts: roundRectPts(-44, -16, 88, 32, 16), close: true }, { pts: [[0, -16], [0, 16]] }],
};
// an icon on a dashed ring, optionally with a flat fill under the first stroke once it is drawn
function iconRing(c, name, x, y, o = {}) {
  const { q = 1, scale = 1, ring = 70, fill, seed = 1, line = PAL.ink, ringColor = PAL.accents[0], lw = 3 } = o; if (q <= 0) return;
  if (ring) dashedRing(c, x, y, ring * Math.max(q, .01), ringColor, seed, [8, 6], 1.4);
  c.save(); c.translate(x, y); c.scale(scale, scale);
  if (fill && q >= .95) { const p = polyPath(ICONS[name][0].pts); c.fillStyle = fill; c.fill(p); surface(c, p, [-60, -60, 120, 120], { seed: seed + 5, alpha: .25, gap: 5, grain: 30 }); }
  c.strokeStyle = line; c.lineWidth = lw / scale; strokes(c, ICONS[name], q, seed + 10); c.restore();
}

// ===================== PUPPET =====================
// One builder for everyone. Local coords: origin at the chest, head up (-y), feet at y = 124, about 250 px tall at scale 1.
// pose: { lean -1..1, arm 0..1 (the look's armSide raises), mood -1..1 (frown..smile), walk phase or undefined, nod 0..1, blink 0|1 }
const HEAD = [0, -84, 34, 37];
const SAM = () => ({ skin: PAL.fills[0], top: PAL.fills[2], hair: PAL.fills[1], style: 'crop', armSide: 1 });
const GPS = [
  () => ({ skin: PAL.fills[0], top: PAL.light, hair: PAL.ink, style: 'bun', glasses: true, coat: true, steth: true, armSide: -1 }),
  () => ({ skin: PAL.fills[5], top: PAL.light, hair: PAL.ink, style: 'crop', beard: true, coat: true, steth: true, armSide: -1 }),
  () => ({ skin: shade(PAL.fills[5], .38), top: PAL.light, hair: PAL.ink, style: 'curls', glasses: true, coat: true, steth: true, armSide: -1 }),
  () => ({ skin: PAL.fills[0], top: PAL.light, hair: PAL.chalkDim, style: 'short', coat: true, steth: true, armSide: -1 }),
  () => ({ skin: PAL.fills[3], top: PAL.light, hair: PAL.fills[1], style: 'bob', coat: true, steth: true, armSide: -1 }),
];
const BODY = { path: () => roundRectPath(-42, -42, 84, 102, 34), pts: () => roundRectPts(-42, -42, 84, 102, 34), box: [-42, -42, 84, 102] };
function drawPerson(c, mode, pose, seed, lookFn = SAM) {
  const look = lookFn(), ink = mode !== 'blueprint', line = ink ? PAL.ink : PAL.chalk, lw = ink ? (PAL.finish === 'pencil' ? 1.2 : 2.6) : 2.6;
  const lean = pose.lean || 0, arm = pose.arm || 0, mood = pose.mood || 0, walk = pose.walk, nod = pose.nod || 0, blink = pose.blink || 0;
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round'; c.rotate(lean * .1); c.strokeStyle = line; c.lineWidth = lw; c.globalAlpha = 1;
  // legs
  for (const s of [-1, 1]) {
    const sw = walk === undefined ? 0 : 1, ph = sw ? Math.sin(walk * TAU + (s > 0 ? Math.PI : 0)) : 0, lift = Math.max(0, ph);
    const kx = s * 18 + ph * 10 * sw, ky = 90 - lift * 8, fx = s * 20 + ph * 22 * sw, fy = 124 - lift * 14;
    wob(c, [[s * 15, 50], [kx, ky], [fx, fy], [fx + s * 14, fy]], 1.5, seed + 3 + s);
  }
  // body
  const body = BODY.path();
  if (ink) { c.fillStyle = look.top; c.fill(body); surface(c, body, BODY.box, { seed: seed + 11 }); }
  if (ink && look.coat) { c.save(); c.clip(body); c.lineWidth = lw * .7; wob(c, [[-24, -42], [-10, -6], [-8, 60]], 1.2, seed + 13); wob(c, [[24, -42], [10, -6], [8, 60]], 1.2, seed + 14); c.restore(); }
  c.strokeStyle = line; c.lineWidth = lw; wob(c, BODY.pts(), 1.8, seed + 12, true);
  if (look.steth) { c.strokeStyle = ink ? PAL.fills[2] : line; c.lineWidth = lw * .8; wob(c, [[-16, -44], [-27, -8], [-14, 26], [4, 31]], 1.2, seed + 15); c.fillStyle = ink ? PAL.fills[2] : PAL.night; c.beginPath(); c.arc(9, 33, 7, 0, TAU); c.fill(); c.strokeStyle = line; wob(c, ellPts(9, 33, 7, 7, 0, 12), .8, seed + 16, true); }
  // arms
  for (const s of [-1, 1]) {
    const up = s === look.armSide ? arm : 0, ex = s * (60 + up * 8), ey = 34 - up * 96;
    c.strokeStyle = line; c.lineWidth = lw; wob(c, [[s * 40, -24], [s * 60, 8 - up * 46], [ex, ey]], 1.6, seed + 20 + s);
    if (ink) { c.fillStyle = look.skin; c.fill(circPath(ex, ey, 7)); } c.lineWidth = lw * .8; wob(c, ellPts(ex, ey, 7, 7, 0, 12), 1, seed + 24 + s, true);
  }
  // head
  c.save(); c.translate(0, nod * 6);
  const head = ellPath(...HEAD), hbox = [-38, -124, 76, 80];
  if (ink) { c.fillStyle = look.skin; c.fill(head); surface(c, head, hbox, { seed: seed + 30, alpha: .18, gap: 6, grain: 60 }); }
  if (ink && look.style !== 'none') {
    c.save(); c.clip(head); c.fillStyle = look.hair; const hp = new Path2D();
    if (look.style === 'crop') hp.ellipse(0, -92, 38, 30, 0, Math.PI, TAU);
    else if (look.style === 'bun' || look.style === 'short') hp.ellipse(0, -96, 40, 26, 0, Math.PI, TAU);
    else if (look.style === 'curls') { hp.ellipse(0, -100, 36, 22, 0, Math.PI, TAU); for (let k = -3; k <= 3; k++) { hp.moveTo(k * 11 + 10, -110 + Math.abs(k) * 4); hp.arc(k * 11, -110 + Math.abs(k) * 4, 10, 0, TAU); } }
    else if (look.style === 'bob') hp.rect(-38, -124, 76, 46);
    hp.closePath(); c.fill(hp); surface(c, hp, hbox, { seed: seed + 32, alpha: .3 }); c.restore();
    if (look.style === 'bun') { c.fillStyle = look.hair; c.fill(circPath(24, -116, 12)); c.strokeStyle = line; c.lineWidth = lw * .8; wob(c, ellPts(24, -116, 12, 12, 0, 16), 1, seed + 33, true); }
    if (look.beard) { c.save(); c.clip(head); c.fillStyle = look.hair; const bp = new Path2D(); bp.ellipse(0, -66, 30, 18, 0, 0, Math.PI); bp.closePath(); c.fill(bp); c.restore(); }
  }
  c.strokeStyle = line; c.lineWidth = lw; wob(c, ellPts(...HEAD), 1.8, seed + 31, true);
  // face
  c.lineWidth = lw * .8; c.fillStyle = line;
  for (const s of [-1, 1]) {
    if (blink) { c.beginPath(); c.moveTo(s * 12 - 4, -90); c.lineTo(s * 12 + 4, -90); c.stroke(); } else { c.beginPath(); c.arc(s * 12, -90, 2.8, 0, TAU); c.fill(); }
    if (mood < -.15) wob(c, [[s * 19, -104], [s * 6, -100]], .8, seed + 40 + s);
    if (look.glasses) { wob(c, ellPts(s * 12, -89, 10, 9, 0, 16), 1, seed + 44 + s, true); }
  }
  if (look.glasses) { c.beginPath(); c.moveTo(-2, -89); c.lineTo(2, -89); c.stroke(); }
  c.beginPath(); c.moveTo(-10, -68); c.quadraticCurveTo(0, -68 + mood * 12, 10, -68); c.stroke();
  c.restore(); c.restore();
}
// blink on the 12 fps grid: one drawn frame closed every 9
const blinkAt = (i, off = 0) => pulse(i + off, 9) ? 1 : 0;

// ===================== SCENES =====================
// Each scene is (c, tau, i): tau = seconds since the scene started, i = global drawn-frame index.
const L1 = layer(), L2 = layer();

// 1. Sam on the paper, wanting an assessment
function sceneSam(c, tau, i) {
  usePalette(ADHDME); paper(c);
  cam(c, CX, CY + 30, lerp(1.08, 1.18, sm(0, 2.5, tau)));
  ground(c, 21, CY + 170);
  const x = CX - 60, y = CY - 15;
  c.save(); c.translate(x, y); c.scale(1.35, 1.35); construction(c, 0, -10, 150, 25);
  drawPerson(c, 'ink', { mood: -.3, blink: blinkAt(i) }, 26, SAM);
  scribble(c, BODY.path(), 0, 9, { seed: 27, amp: 5, alpha: .45 });
  c.restore();
  const q = sm(.4, 1.1, tau, easeOut), bx = x + 360, by = y - 270;
  bubbleTrail(c, [x + 70, y - 150], [bx - 150, by + 100], 28, q);
  bubble(c, bx, by, 200, 125, 29, cc => {
    cc.save(); cc.translate(-85, 40); cc.scale(.55, .55); drawPerson(cc, 'ink', { mood: .2 }, 30, GPS[0]); cc.restore();
    hand(cc, '?', 80, 60, { size: 170, ink: PAL.blush, ink2: PAL.accents[2], align: 'center' });
  }, q);
  caption(c, 'Sam needs an ADHD assessment. Step one: find a GP.', { p: sm(.6, 1.8, tau) });
}

// 2. The directory: page after page of identical listings (pencil look)
function sceneDirectory(c, tau, i) {
  usePalette(ADHDME_PENCIL); paper(c);
  const scroll = Math.floor(tau * 12 / 4) * 50;          // the page scrolls one notch every 4 drawn frames
  c.save(); c.beginPath(); c.rect(0, 0, W, H * .855); c.clip();   // the page stops above the caption band
  cam(c, CX, CY + scroll, 1);
  const x0 = W * .30, rowH = 150;
  for (let r = 0; r < 14; r++) {

  const qs = sm(1.2, 1.5, tau); if (qs > 0) { c.strokeStyle = PAL.accents[3]; c.lineWidth = 6; selfDraw(c, [[sx - 74, sy - 74], [sx + 74, sy + 74]], qs, 91, 2); selfDraw(c, [[sx + 74, sy - 74], [sx - 74, sy + 74]], qs, 92, 2); }
  hand(c, 'fit, not stars', sx, sy + 130, { size: 40, ink: PAL.chalk, ink2: PAL.accents[2], align: 'center' });
  caption(c, 'Every consult makes the next match better.', { ink: PAL.chalk, ink2: PAL.accents[2] });
}
function sceneLoop(c, tau, i) {
  const b = L2.getContext('2d'); drawLoop(b, tau, i);
  if (tau >= .5) { blit(c, L2); return; }
  usePalette(ADHDME); paper(c); const R = lerp(0, W * .62, sm(0, .5, tau, easeOut));
  iris(c, CX, CY, R, cc => blit(cc, L2)); c.strokeStyle = PAL.ink; c.lineWidth = 3; wob(c, ellPts(CX, CY, R, R, 0, 120), 2, 93, true);
}

// 10. Patient value: save money, get diagnosed fast, find a doctor who gets you
function sceneValue(c, tau, i) {
  usePalette(ADHDME); paper(c); cam(c, CX, CY, 1);
  [['tag', 'transparent'], ['clock', 'fast'], ['pair', 'personal']].forEach(([ic, label], n) => { const t0 = n * .4, q = sm(t0, t0 + .45, tau, easeOut); if (q <= 0) return; const x = W * .25 + n * W * .25, y = CY - 120, r = 150 * q;
    const disc = circPath(x, y, r); c.fillStyle = PAL.fills[0]; c.fill(disc); surface(c, disc, [x - r, y - r, 2 * r, 2 * r], { seed: 600 + n, alpha: .22, grain: 80 });
    c.strokeStyle = PAL.ink; c.lineWidth = 3; wob(c, ellPts(x, y, r, r, 0, 60), 2, 610 + n, true);
    iconRing(c, ic, x, y + (ic === 'pair' ? 14 : 0), { q, scale: 1.4 * q, ring: r + 24, seed: 620 + n, lw: 3.2, ringColor: PAL.accents[0] });
    if (ic === 'tag' && q >= .95) hand(c, '$', x + 4, y + 30, { size: 74, ink: PAL.accents[1], ink2: null, align: 'center' });
    if (ic === 'pair' && q >= .95) aster(c, x, y - 70, 6, 10, PAL.accents[2], 640, 1, PAL.accents[2], PAL.ink);
    hand(c, label, x, y + 250, { size: 52, align: 'center', al: q });
  });
  c.save(); c.translate(W * .72, H * .86); c.scale(.75, .75); drawPerson(c, 'ink', { mood: .8, blink: blinkAt(i) }, 26, SAM); c.restore();
  c.save(); c.translate(W * .80, H * .86); c.scale(.75, .75); drawPerson(c, 'ink', { mood: .7, blink: blinkAt(i, 4) }, 510, GPS[0]); c.restore();
  caption(c, 'Save money. Get diagnosed fast. Find a doctor who gets you.', { size: 50 });
}

// 11. The tagline
function sceneTagline(c, tau, i) {
  usePalette(ADHDME); paper(c); cam(c, CX, CY, 1);
  ripples(c, CX, CY - 60, [420, 520, 640], alpha(PAL.accents[0], .25), 700, 3);
  const a = 'The right ADHD doctor', b = 'should not be hard to find.';
  hand(c, a.slice(0, Math.round(a.length * sm(0, .7, tau))), CX, CY - 90, { size: 120, align: 'center' });
  hand(c, b.slice(0, Math.round(b.length * sm(.6, 1.4, tau))), CX, CY + 40, { size: 120, align: 'center' });
  const x = lerp(CX - 220, CX + 220, sm(0, 2, tau, easeIO));
  c.save(); c.translate(x - 70, H * .82); c.scale(.8, .8); drawPerson(c, 'ink', { mood: .8, walk: tau * 1.5, lean: -.1, blink: blinkAt(i) }, 26, SAM); c.restore();
  c.save(); c.translate(x + 70, H * .82); c.scale(.8, .8); drawPerson(c, 'ink', { mood: .7, walk: tau * 1.5 + .5, lean: -.1, blink: blinkAt(i, 4) }, 510, GPS[0]); c.restore();
}

// 12. Sign-off
function sceneSignoff(c, tau, i) {
  usePalette(ADHDME); paper(c); ripples(c, CX, CY, [260, 340, 430], alpha(PAL.accents[1], .3), 710, 3);
  signOff(c, 'ADHDme', 'adhdme.au', { x: CX, y: CY - 30, size: 130, ink2: PAL.accents[0], progressA: sm(0, .5, tau), progressB: sm(.5, 1.0, tau) });
  c.save(); c.translate(CX, H * .87); c.scale(.55, .55); drawPerson(c, 'ink', { mood: .9, arm: .9, blink: blinkAt(i) }, 26, SAM); c.restore();
}

// ===================== FILM =====================
const TIMELINE = [
  { name: 'sam',       dur: 2.50, fn: sceneSam },
  { name: 'directory', dur: 2.00, fn: sceneDirectory },
  { name: 'stuck',     dur: 4.25, fn: sceneStuck },
  { name: 'frontdoor', dur: 2.75, fn: sceneFrontDoor },
  { name: 'find',      dur: 2.50, fn: sceneFind },
  { name: 'compare',   dur: 2.00, fn: sceneCompare },
  { name: 'book',      dur: 1.75, fn: sceneBook },
  { name: 'assess',    dur: 2.50, fn: sceneAssess },
  { name: 'loop',      dur: 2.50, fn: sceneLoop },
  { name: 'value',     dur: 2.50, fn: sceneValue },
  { name: 'tagline',   dur: 2.00, fn: sceneTagline },
  { name: 'signoff',   dur: 1.50, fn: sceneSignoff },
];
const T = {}; { let acc = 0; for (const s of TIMELINE) { T[s.name] = acc; acc += s.dur; } T.end = acc; }

// ===================== SCORE =====================
// Reads the same timeline as the pictures: a motif per scene, a cue on every cut and every reveal.
function score(ac, t0, dest) {
  const master = ac.createGain(); master.gain.value = .55; master.connect(dest); const r = rng(7);
  const n = (hz, t, d, type, g) => note(ac, master, hz, t0, t, d, type, g);
  for (let t = T.sam; t < T.directory; t += .5) n(pentHz(0, r() * 5 | 0), t, .7, 'triangle', .16);
  for (let t = T.directory; t < T.stuck; t += .75) n(pentHz(-1, r() * 5 | 0), t, .9, 'sine', .12);
  [0, 1, 2].forEach(k => n(pentHz(0, 4 - k), T.stuck + k, .5, 'triangle', .18)); n(pentHz(-1, 0), T.stuck + 3, 1.2, 'sine', .2);
  n(55, T.frontdoor, 1.4, 'sawtooth', .10); n(110, T.frontdoor + .1, 1.2, 'sine', .14);
  [0, 1, 2].forEach(k => n(pentHz(1, k + 1), T.frontdoor + 1.2 + k * .4, .5, 'sine', .2));
  for (let k = 0; k < 5; k++) n(pentHz(1 + (k % 2), k), T.find + k * .5, .22, 'square', .06);
  n(pentHz(0, 0), T.compare, .6, 'triangle', .16); n(pentHz(0, 2), T.compare + .5, .6, 'triangle', .16); n(pentHz(2, 4), T.compare + 1.25, .5, 'sine', .2);
  n(pentHz(1, 0), T.book + .25, .4, 'sine', .2); n(pentHz(1, 2), T.book + .75, .4, 'sine', .2); for (let k = 0; k < 4; k++) n(pentHz(1, k), T.book + 1.0 + k * .125, .18, 'square', .05);
  for (let t = T.assess; t < T.loop; t += .5) n(pentHz(0, r() * 5 | 0), t, .6, 'triangle', .12);
  [0, 1, 2].forEach(k => n(pentHz(1, (k * 2) % 5), T.assess + .5 + k * .6, .5, 'sine', .18));
  n(55, T.loop, 1.6, 'sawtooth', .09); n(110, T.loop + .1, 1.4, 'sine', .12);
  for (let k = 0; k < 5; k++) n(pentHz(1, k), T.loop + .3 + k * .3, .3, 'sine', .16);
  for (let k = 0; k < 5; k++) n(pentHz(2, k), T.loop + 1.9 + k * .12, .2, 'sine', .12);
  [0, 1, 2].forEach(k => n(pentHz(1, [0, 2, 4][k]), T.value + k * .4, .7, 'triangle', .2));
  n(pentHz(0, 0), T.tagline, 2.0, 'sine', .22); n(pentHz(1, 2), T.tagline + .6, 1.6, 'sine', .14);
  n(pentHz(0, 0), T.signoff, 1.5, 'sine', .25); n(pentHz(0, 2), T.signoff + .6, 1.0, 'sine', .18);
}

// The hand font must be in before the first frame is drawn; render.mjs waits for window.__ready.
document.fonts.load('600 40px "Bradley Hand"').catch(() => {}).then(() =>
  defineFilm({ palette: ADHDME, timeline: TIMELINE, score, format: { ar: '16:9', width: 1920 } }));   // render.mjs --ar 1:1 or 9:16 overrides
</script>

<script>
'use strict';
// ============================================================
// ADHDme, the pitch: a riso-printed startup pitch drawn frame by frame on Canvas 2D on top of core.js
// (hand-drawn-canvas-animation skill), with its own synth score and no voice. No images, no libraries, no Math.random.
// ============================================================

// ===================== BRIEF & BEAT SHEET =====================
// BRIEF
// Subject: ADHDme as a YC-style pitch told in lettering and music: hook, problem, who, solution, three matches
//          on life experience shown as faces, how the match is made (what we ask, what we know about each
//          clinician, two models side by side, the feedback loop), what that changes, how it works, why now,
//          market, model, traction, close. Content from the Value Proposition Canvas with numbers from the deck.
// Format: 16:9, output width 1920, drawn 12 fps, output 24 fps, 2 min 47 s from the beat sheet below.
// Pace:   slow. Headlines type over 1.2 s, sub lines over 1.6 s as soon as the picture has made its point,
//         reveals spread across each beat, and every card holds long enough to read twice.
// Look:   riso throughout: cream stock, fluorescent inks printed as halftone plates with knockouts, each
//         card's plates arriving in print order. People are drawn: skin, hair and clothes as flat fills under
//         a riso dot screen, features in navy line. Icons are small drawn marks on paper discs.
// Palette: risoPop (blue, pink, yellow, navy). Skin tones and clothes are tints and shades of its fills.
// Anchor: the logo's orange full stop, with a pink offset, at the bottom centre of every frame.
// Logo:   drawn, not loaded: "me" in Poppins Black with A D H D scattered above in Courier Prime, each at its own
//         tilt, and the orange full stop; on its yellow field for the title card, bare for the sign-off.
// Puppets: bust() for every person (three patients, five clinicians, five young people, families, crowds);
//          icon() for two dozen marks: baby, moon, house, family, languages, plain speech, a pill with a
//          question, tag, phone, clock, calendar, checklist, stethoscope, heart, microphone, match rings,
//          a network, notes, a crossed star, coin, bell, pin, magnifier.
// Sound:  arpeggio and synths, no voice, written as a song: intro, verse, pre-chorus, chorus with a melody
//         that varies on each match, a second verse on new chords for the engine, the chorus again up a
//         whole tone for the value, a bridge and a breakdown, a last chorus, an outro. See score().
//
// beat       what changes
// hook       ripples from the dot; an iris opens on the title card
// maze..giveup  a real maze; a swinging tag; a peg on the wrong hole; three sheets; a draining bottle; "people give up"
// who        Australia prints in, three cities ring; five young people arrive in a row
// solution   a patient faces five clinicians; lines draw; the fit lights up
// pair1..3   a patient and a clinician face each other with the life around the patient printed behind; the line lands
// algo1      what we ask: a patient with the four things about their life that decide a match, arriving beside them
// algo2      what we know: a clinician with the four things the interview covers
// algo3      two models side by side: rules that score the four factors as bars; a language model that reads what you wrote
// algo4      the loop: a consultation ringed by five fit signals, feeding the next match
// value      three columns: they fit before you meet; faster and cheaper; the same clinician at 6, 12, 24 months
// how        cost bands, templates, alerts, free for patients
// whynow     starfield timeline: QLD live, NSW and VIC 2026
// market     >1M pops, 250K counts up while a quarter of the crowd turns pink
// model      duotone: patient, door, clinician
// traction   three stamps land with a tilt; two GPs stand by theirs
// gallery    every card as a badge, collapsing into the dot
// close      the tagline; the six people stand together, smiling
// signoff    ADHDme / adhdme.au

// ===================== TIMELINE =====================
// The beat sheet, in seconds. There is no voice: the lettering is the script, so each card holds long enough for

const ORDER = Object.keys(B);

// ===================== PALETTE =====================
usePalette('risoPop');
const DUO = makePalette({ paperBand: null }, duotone(PALETTES.risoPop.inks[1], PALETTES.risoPop.inks[0]));
const ANCHOR = () => [CX, H * .905];
const SKIN = () => ({ light: tint(PAL.fills[4], .66), mid: tint(PAL.fills[4], .34), tan: shade(tint(PAL.fills[4], .18), .18), deep: shade(PAL.fills[4], .5) });
const TYPE = 1.2, TYPE2 = 1.6;   // seconds a headline and a sub line take to type

// ===================== HELPERS =====================
function hand(c, text, x, y, o = {}) {
  const { size = 48, ink = PAL.ink, ink2 = PAL.accents[0], offset = 4, align = 'left', al = 1, font = HAND_FONT } = o;
  if (!text) return;
  c.save(); c.font = `${size}px ${font}`; c.textAlign = align; c.textBaseline = 'alphabetic';
  if (ink2) { c.fillStyle = ink2; c.globalAlpha = .85 * al; c.fillText(text, x + offset, y + offset * .6); }
  c.fillStyle = ink; c.globalAlpha = al; c.fillText(text, x, y); c.restore();
}
function mixed(c, parts, x, y, size, o = {}) {

}
const typed = (text, p) => text.slice(0, Math.round(text.length * clamp(p, 0, 1)));
const head = (c, text, o = {}) => hand(c, typed(text, o.p ?? 1), CX, o.y ?? H * .17, { size: 100, align: 'center', ...o });
const sub = (c, text, o = {}) => hand(c, typed(text, o.p ?? 1), o.x ?? CX, o.y ?? H * .86, { size: 50, align: 'center', ink2: null, ...o });
const label = (c, text, p = 1) => hand(c, typed(text, p), CX, H * .83, { size: 84, align: 'center' });
const blinkAt = (i, off = 0) => pulse(i + off, 11) ? 1 : 0;
// the anchor: the logo's orange full stop, with a pink misregistration
function mark(c) { resetT(c); const [x, y] = ANCHOR(); const R = PALETTES.risoPop; seedDot(c, x, y, 11, R.fills[4], R.accents[0]); }   // always the brand orange, even on the duotone card
// the logo, drawn: "me" in the heavy face with its baseline at (x, y) and font size s; A D H D scattered above in the
// typewriter face, each at its own tilt; the orange full stop after the e. Two inks: a pink offset under the navy.
function logo(c, x, y, s, o = {}) {

  c.save(); c.translate(x, y); c.font = `${s}px "Poppins Black"`; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  const w = c.measureText('me').width;

  letters.forEach(([ch, lx, ly, rot], n) => { if (q < (n + 1) / 5) return; c.save(); c.translate(lx * w, ly * s); c.rotate(rot); c.font = `${s * .19}px "Courier Prime Bold"`; c.textAlign = 'center'; if (ink2) { c.fillStyle = ink2; c.globalAlpha = .85; c.fillText(ch, offset, offset * .6); } c.fillStyle = ink; c.globalAlpha = 1; c.fillText(ch, 0, 0); c.restore(); });
  if (q >= 1) { if (ink2) { c.fillStyle = ink2; c.globalAlpha = .85; c.beginPath(); c.arc(w + s * .24 + offset, -s * .1 + offset * .6, s * .1, 0, TAU); c.fill(); } c.fillStyle = dot; c.globalAlpha = 1; c.beginPath(); c.arc(w + s * .24, -s * .1, s * .1, 0, TAU); c.fill(); }

}
const PLATES = [layer(), layer(), layer()], ARRIVAL = [3 / 12, 6 / 12, 0];
function risoCard(c, draw, o = {}) {

  inks.forEach((ink, k) => { if (tau < (inks.length === 3 ? ARRIVAL[k] : k * 3 / 12)) return;
    const P = PLATES[k], g = P.getContext('2d'); resetT(g); g.globalAlpha = 1; g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.fillStyle = '#000'; g.strokeStyle = '#000'; g.lineWidth = 6; g.lineCap = 'round'; draw(g, k); printPlate(c, P, { cell, ink, angle: angles[k], seed: 30 + k }); });

const gray = v => `rgb(${255 - v * 255 | 0},${255 - v * 255 | 0},${255 - v * 255 | 0})`;
const radial = (g, x, y, r0, r1, c0, c1) => { const gr = g.createRadialGradient(x, y, r0, x, y, r1); gr.addColorStop(0, c0); gr.addColorStop(1, c1); return gr; };

function ko(g, text, x, y, size, align = 'center') { g.save(); g.font = `${size}px ${HAND_FONT}`; g.textAlign = align; g.fillStyle = '#fff'; g.fillText(text, x, y); g.restore(); }
function pill(g, x, y, w, h) { g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, h / 2); g.fill(); }
function roundRectPts(x, y, w, h, r, n = 6) { const pts = [], corner = (cx, cy, a0) => { for (let k = 0; k <= n; k++) { const a = a0 + k / n * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } }; corner(x + w - r, y + r, -Math.PI / 2); corner(x + w - r, y + h - r, 0); corner(x + r, y + h - r, Math.PI / 2); corner(x + r, y + r, Math.PI); return pts; }

function tagPath(g, x, y, s) { g.beginPath(); g.moveTo(x - 48 * s, y - 30 * s); g.lineTo(x + 14 * s, y - 30 * s); g.lineTo(x + 50 * s, y); g.lineTo(x + 14 * s, y + 30 * s); g.lineTo(x - 48 * s, y + 30 * s); g.closePath(); }
const heartPts = (cx, cy, k, n = 40) => Array.from({ length: n }, (_, j) => { const t = j / n * TAU; return [cx + 16 * Math.pow(Math.sin(t), 3) * k, cy - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * k + 3 * k]; });
const arcPts = (cx, cy, rx, ry, a0, a1, n = 30) => Array.from({ length: n + 1 }, (_, k) => { const a = a0 + (a1 - a0) * k / n; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });

  if (look.style === 'hood') { c.strokeStyle = line; c.lineWidth = 2.4; wob(c, arcPts(0, -110, 58, 50, Math.PI * 1.12, Math.PI * 1.88), 1.4, seed + 48); }
  if (look.beard) { c.save(); c.clip(ellPath(0, -104, 62, 72)); part(halfPath(0, -84, 48, 36, false), arcPts(0, -84, 48, 36, 0, Math.PI), [-48, -84, 96, 40], look.hair, 50, { color: PAL.inks[0], density: .5 }); c.restore(); }
  if (!look.faceless) {

  // the song: a section per group of beats. key, chord loop, arpeggio shapes and rate (notes a beat), bass pattern,
  // pad level, arpeggio levels (arp, and high an octave up on the off-beats), filter cutoff, lead level
  const SECTION = id => id === 'hook' ? 'intro' : ['maze', 'pain1', 'pain2', 'pain3', 'pain4'].includes(id) ? 'verse' : id === 'giveup' ? 'drop'
    : ['who', 'solution'].includes(id) ? 'pre' : id.startsWith('pair') ? 'chorus' : id.startsWith('algo') ? 'verse2' : id === 'value' ? 'chorus2'
    : id === 'how' ? 'bridge' : id === 'whynow' ? 'breakdown' : ['market', 'model', 'traction'].includes(id) ? 'last' : id === 'gallery' ? 'outro' : id === 'close' ? 'close' : 'end';
  const SONG = {
    intro:     { key: 60, loop: ['I', 'IV'], shapes: ['slow'], rate: 1, bass: 'none', lvl: .045, arp: .05, high: 0, lp: 900 },
    verse:     { key: 60, loop: ['vi', 'IV', 'I', 'V'], shapes: ['slow'], rate: 1, bass: 'long', lvl: .045, arp: .05, high: 0, lp: 800 },
    drop:      { key: 60, loop: ['vi'], shapes: ['slow'], rate: 1, bass: 'none', lvl: .04, arp: .03, high: 0, lp: 600 },
    pre:       { key: 60, loop: ['I', 'V', 'vi', 'IV'], shapes: ['up', 'wide'], rate: 2, bass: 'long', lvl: .05, arp: .05, high: 0, lp: 1100 },
    chorus:    { key: 60, loop: ['I', 'V', 'vi', 'IV'], shapes: ['wide', 'up'], rate: 2, bass: 'long', lvl: .055, arp: .055, high: .022, lp: 1250, lead: .05 },
    verse2:    { key: 60, loop: ['vi', 'ii', 'IV', 'V'], shapes: ['updown', 'up'], rate: 2, bass: 'eighths', lvl: .055, arp: .06, high: .026, lp: 1300 },
    chorus2:   { key: 62, loop: ['I', 'V', 'vi', 'IV'], shapes: ['wide', 'up'], rate: 2, bass: 'long', lvl: .062, arp: .065, high: .03, lp: 1500, lead: .055 },
    bridge:    { key: 62, loop: ['IV', 'I', 'V', 'vi'], shapes: ['up', 'updown'], rate: 2, bass: 'eighths', lvl: .055, arp: .06, high: .024, lp: 1400 },
    breakdown: { key: 62, loop: ['IV', 'iv', 'I', 'I'], shapes: ['slow'], rate: 1, bass: 'none', lvl: .05, arp: .045, high: 0, lp: 700 },
    last:      { key: 62, loop: ['I', 'V', 'vi', 'IV'], shapes: ['wide', 'up'], rate: 2, bass: 'long', lvl: .06, arp: .06, high: .028, lp: 1500 },
    outro:     { key: 62, loop: ['I', 'IV'], shapes: ['wide'], rate: 2, bass: 'none', lvl: 0, arp: .05, high: 0, lp: 1100 },
    close:     { key: 62, loop: ['IV', 'V', 'I', 'I'], shapes: ['slow'], rate: 1, bass: 'long', lvl: .05, arp: .045, high: 0, lp: 1000, lead: .05 },
    end:       { key: 62, loop: ['I'], shapes: ['slow'], rate: 1, bass: 'none', lvl: .05, arp: .04, high: 0, lp: 900 },
  };
  const barsIn = {};   // bars already played in each section, so the chords and shapes keep turning across cuts
  ORDER.forEach((id, k) => {
    const b = B[id], name = SECTION(id), S = SONG[name], endsSection = k + 1 >= ORDER.length || SECTION(ORDER[k + 1]) !== name;
    lp.frequency.linearRampToValueAtTime(S.lp, t0 + b.start + .5);
    for (let t = b.start; t < b.start + b.dur - .05; t += bar) {
      const n = barsIn[name] = (barsIn[name] || 0) + 1, dur = Math.min(bar, b.start + b.dur - t), ch = DEG[S.loop[(n - 1) % S.loop.length]].map(x => x + S.key), root = ch[0];
      const lastBar = endsSection && t + bar >= b.start + b.dur - .05;
      if (S.lvl) pad(ch, t, dur, S.lvl);
      if (S.bass === 'long') { bass(root, t, beat * 1.7, .13); if (dur > beat * 2.2) bass(root, t + beat * 2, beat * 1.7, .09); }
      if (S.bass === 'eighths') for (let e = 0; e < 8; e++) if (e * beat / 2 < dur - .1) bass(root + (e % 4 === 3 ? 12 : 0), t + e * beat / 2, .28, e % 2 ? .07 : .11);
      const step = beat / S.rate; let pat = SHAPE[S.shapes[(n - 1) % S.shapes.length]](ch);
      if (lastBar && S.rate === 2) pat = [...pat.slice(0, 4), ...RUN(ch)];
      pat.forEach((m, j) => { if (j * step < dur - .1) pluck(m, t + j * step, S.rate === 2 ? .4 : .75, S.arp); });
      if (S.high) pat.forEach((m, j) => { if (j * step + step / 2 < dur - .1) pluck(m + 12, t + j * step + step / 2, .3, S.high, 'sine', highBus); });
    }
    if (S.lead && MELODY[id]) MELODY[id].forEach(([dg, q, len]) => lead(S.key + 12 + dg, b.start + 1.0 + q * beat, len * beat, S.lead));
  });
  // accents on the cuts and reveals
  pluck(84, B.hook.start + D('hook') * .5, 1.2, .16, 'sine'); pluck(88, B.hook.start + D('hook') * .5 + .3, 1.2, .12, 'sine');
  ['pain1', 'pain2', 'pain3', 'pain4'].forEach((id, k) => pluck(69 + [0, 2, 4, 7][k], B[id].start, .35, .08, 'square'));
  pluck(45, B.giveup.start, 1.8, .18, 'sine');
  pluck(84, B.solution.start + D('solution') * .5 + .9, 1.0, .16, 'sine');
  ['pair1', 'pair2', 'pair3'].forEach(id => { const t = B[id].start + D(id) * .45 + 1.0; pluck(84, t, .9, .16, 'sine'); pluck(91, t + .2, 1.2, .12, 'sine'); });
  ['algo1', 'algo2'].forEach(id => { const [at, step] = GRID_AT(D(id)); for (let n = 0; n < 4; n++) pluck(72 + [0, 4, 7, 12][n], B[id].start + at + n * step + .3, .3, .07, 'square'); });
  for (let n = 0; n < 5; n++) pluck(72 + [0, 4, 7, 11, 12][n], B.algo4.start + D('algo4') * (.18 + n * .1), .4, .08, 'square');
  for (let n = 0; n < 8; n++) pluck(62 + n * 2, B.whynow.start + D('whynow') - 1.6 + n * .2, .3, .05 + n * .01, 'square');   // a riser into the market
  pluck(98, B.market.start + .5, 1.6, .14, 'sine'); pluck(93, B.market.start + D('market') * .45, 1.2, .12, 'sine');
  [0, 1, 2].forEach(k => pluck(74 + [0, 4, 7][k], B.traction.start + D('traction') * (.15 + k * .2), 1.0, .16, 'triangle'));
  pluck(62, B.close.start, 3.0, .12, 'sine'); pluck(69, B.close.start + .6, 2.6, .1, 'sine'); pluck(74, B.signoff.start, 3.4, .14, 'sine'); pluck(78, B.signoff.start + .4, 3.0, .1, 'sine'); pluck(50, B.signoff.start, 3.6, .16, 'sine');
}

Promise.all(['40px "Bradley Hand"', '40px "Noto Devanagari"', '40px "Noto Urdu"', '40px "Poppins Black"', '40px "Courier Prime Bold"'].map(f => document.fonts.load(f).catch(() => {}))).then(() =>
  defineFilm({ palette: 'risoPop', timeline: TIMELINE, score, format: { ar: '16:9', width: 1920 } }));
</script>

<!doctype html>
<meta charset="utf-8">
<title>ADHDme: the pitch</title>
<style>
  /* core.js lists "Bradley Hand" first in HAND_FONT. Registering Caveat Brush (OFL, fonts/OFL.txt) under that
     name gives this film its bold marker lettering on every machine, headless or not. */
  @font-face { font-family: "Bradley Hand"; src: url("fonts/CaveatBrush-Regular.ttf"); }
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(92vw,960px);height:auto;background:#000;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="core.js"></script>
<script>
'use strict';
// ============================================================
// ADHDme, the pitch: a riso-printed startup pitch drawn frame by frame on Canvas 2D on top
// of core.js (hand-drawn-canvas-animation skill). No images, no libraries, no Math.random.
// ============================================================

// ===================== BRIEF & BEAT SHEET =====================
// BRIEF
// Subject: ADHDme as a YC-style pitch: hook, problem, who, solution, matching on life experience,
//          how, why now, market, business model, traction, close. Content from the Value Proposition
//          Canvas (customer jobs, pains, relievers, gains, the free-for-patients model, the GP-led
//          pathway) with market numbers and traction from the strategic plan deck.
// Format: 16:9, output width 1920, drawn 12 fps, output 24 fps, 60 seconds. A slow, deliberate pace:
//         every beat holds long enough to read twice; every card moves inside its hold.
// Look:   riso throughout: cream stock, fluorescent inks printed as halftone plates with knockouts.
//         Each card's plates arrive in print order (yellow, then blue, then pink) over the first
//         third of a second, the way a print run lands. Crayon ripples, an iris, a card montage,
//         a badge gallery, one duotone beat, one starfield.
// Palette: risoPop (blue, pink, yellow, navy). Duotone pink and blue for the business-model beat.
// Finish: riso.
// Anchor: the seed dot, navy with a pink offset, at the bottom centre of every frame. The hook's
//         ripples are born from it and the gallery collapses into it.
// Puppets: none. Every card is silhouettes on three plates, then hand lettering in two inks.
// Text:   a pitch is headlines and numbers, so every card carries one headline that types itself in
//         and one line under it, in bold marker lettering with a pink offset. Numbers are big.
//
// t      dur   scene      look        what changes                                                    kit                            sound
// 0.00   4.00  hook       riso        ripples from the dot; an iris opens on the title card            crayon iris plates             slow plucks, rising note
// 4.00   7.00  problem    riso        "a maze" (a real one), four pain cards at 1 s, "people give up"  plates knockouts montage       square per cut, low sine
// 11.00  4.00  who        riso        Australia prints in, three cities ring one by one                plates dashedRing              two plucks, three ticks
// 15.00  4.50  solution   riso        patient dot, five clinicians, lines draw, the fit lights up      plates crayon selfDraw         sine, bright note at the match
// 19.50  6.50  psycho     riso        three patients paired with three clinicians on life experience   plates crayon glow             a note per pair
// 26.00  6.00  how        riso        cost bands, diagnosis templates, script alerts, 2 s each         montage plates selfDraw        square per card
// 32.00  5.00  whynow     starfield   timeline: QLD live, NSW and VIC 2026, asters ignite              night grain aster dashedRing   sawtooth swell, notes per stamp
// 37.00  5.00  market     riso        >1M pops, 250K counts up while a quarter of the crowd turns pink plates hand                    two dyads
// 42.00  4.50  model      duotone     patient, door, clinician in two inks; free for patients           duotone plates crayon          plucks
// 46.50  3.50  traction   riso        three stamps land with a tilt: live, 2 GPs, 2 matching models    plates dashedRing              three rising notes
// 50.00  3.00  gallery    riso        every card as a badge on rings, collapsing into the dot           badges                         long dyad
// 53.00  4.00  close      riso        the tagline types out over faint ripples                         crayon hand                    long dyad
// 57.00  3.00  signoff    riso        ADHDme / adhdme.au, two dots                                     signOff                        dyad, 1 s release

// ===================== PALETTE =====================
usePalette('risoPop');
const DUO = makePalette({ paperBand: null }, duotone(PALETTES.risoPop.inks[1], PALETTES.risoPop.inks[0]));   // pink and blue, the flipbook's two-ink beat, on plain stock
const ANCHOR = () => [CX, H * .905];

// ===================== HELPERS =====================
// hand lettering in two inks (Caveat Brush is a single weight)
function hand(c, text, x, y, o = {}) {
  const { size = 48, ink = PAL.ink, ink2 = PAL.accents[0], offset = 4, align = 'left', al = 1 } = o;
  if (!text) return;
  c.save(); c.font = `${size}px ${HAND_FONT}`; c.textAlign = align; c.textBaseline = 'alphabetic';
  if (ink2) { c.fillStyle = ink2; c.globalAlpha = .85 * al; c.fillText(text, x + offset, y + offset * .6); }
  c.fillStyle = ink; c.globalAlpha = al; c.fillText(text, x, y); c.restore();
}
const typed = (text, p) => text.slice(0, Math.round(text.length * clamp(p, 0, 1)));
// headline at the top, typed in over its `p`; a sub line at the bottom; a label for the pain cards
const head = (c, text, o = {}) => hand(c, typed(text, o.p ?? 1), CX, o.y ?? H * .17, { size: 100, align: 'center', ...o });
const sub = (c, text, o = {}) => hand(c, typed(text, o.p ?? 1), CX, o.y ?? H * .86, { size: 50, align: 'center', ink2: null, ...o });
const label = (c, text, p = 1) => hand(c, typed(text, p), CX, H * .83, { size: 84, align: 'center' });
// the anchor
function mark(c, onNight = false) { resetT(c); const [x, y] = ANCHOR(); seedDot(c, x, y, 11, onNight ? PAL.chalk : PAL.ink, PAL.accents[0]); }
// riso printing: three reusable plates, coverage drawn in black on white, white is a knockout.
// Plates arrive in print order over the first third of a second of a card: yellow, then blue, then pink.
const PLATES = [layer(), layer(), layer()], ARRIVAL = [2 / 12, 4 / 12, 0];
function risoCard(c, draw, o = {}) {
  const inks = o.inks || PAL.inks.slice(0, 3), angles = o.angles || [.26, 1.31, 0], cell = o.cell || 7, tau = o.tau ?? 99; paper(c);
  inks.forEach((ink, k) => { if (tau < (inks.length === 3 ? ARRIVAL[k] : k * 2 / 12)) return;
    const P = PLATES[k], g = P.getContext('2d'); resetT(g); g.globalAlpha = 1; g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.fillStyle = '#000'; g.strokeStyle = '#000'; g.lineWidth = 6; g.lineCap = 'round'; draw(g, k); printPlate(c, P, { cell, ink, angle: angles[k], seed: 30 + k }); });
}
const gray = v => `rgb(${255 - v * 255 | 0},${255 - v * 255 | 0},${255 - v * 255 | 0})`;   // plate coverage 0..1 -> grey
const radial = (g, x, y, r0, r1, c0, c1) => { const gr = g.createRadialGradient(x, y, r0, x, y, r1); gr.addColorStop(0, c0); gr.addColorStop(1, c1); return gr; };
function glow(g, x, y, r0, r1, v) { g.fillStyle = radial(g, x, y, r0, r1, gray(v), gray(0)); g.fillRect(0, 0, W, H); }
function ko(g, text, x, y, size, align = 'center') { g.save(); g.font = `${size}px ${HAND_FONT}`; g.textAlign = align; g.fillStyle = '#fff'; g.fillText(text, x, y); g.restore(); }   // knockout lettering
function pill(g, x, y, w, h) { g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, h / 2); g.fill(); }
function doorPath(g, cx, cy, w, h) { g.beginPath(); g.moveTo(cx - w / 2, cy + h / 2); g.lineTo(cx - w / 2, cy - h / 2 + w / 2); g.arc(cx, cy - h / 2 + w / 2, w / 2, Math.PI, 0); g.lineTo(cx + w / 2, cy + h / 2); g.closePath(); }
function bellPath(g, x, y, s) { g.beginPath(); g.moveTo(x - 70 * s, y + 40 * s); g.quadraticCurveTo(x - 70 * s, y - 60 * s, x, y - 72 * s); g.quadraticCurveTo(x + 70 * s, y - 60 * s, x + 70 * s, y + 40 * s); g.lineTo(x + 92 * s, y + 62 * s); g.lineTo(x - 92 * s, y + 62 * s); g.closePath(); }
function tagPath(g, x, y, s) { g.beginPath(); g.moveTo(x - 48 * s, y - 30 * s); g.lineTo(x + 14 * s, y - 30 * s); g.lineTo(x + 50 * s, y); g.lineTo(x + 14 * s, y + 30 * s); g.lineTo(x - 48 * s, y + 30 * s); g.closePath(); }
// a real maze (recursive backtracker, seeded) for the problem card
const MZ = { s: 110, cols: 19, rows: 11 };
const MAZE = (() => { const { cols, rows } = MZ, r = rng(55), vis = Array(cols * rows).fill(false), right = Array(cols * rows).fill(true), below = Array(cols * rows).fill(true), stack = [[0, 0]]; vis[0] = true;
  while (stack.length) { const [x, y] = stack[stack.length - 1], nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [x + dx, y + dy, dx, dy]).filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < cols && ny < rows && !vis[ny * cols + nx]);
    if (!nb.length) { stack.pop(); continue; } const [nx, ny, dx, dy] = nb[r() * nb.length | 0];
    if (dx === 1) right[y * cols + x] = false; if (dx === -1) right[ny * cols + nx] = false; if (dy === 1) below[y * cols + x] = false; if (dy === -1) below[ny * cols + nx] = false; vis[ny * cols + nx] = true; stack.push([nx, ny]); }
  return { right, below }; })();
// a rough Australia, lon/lat, for the segment card
const AUS = [[114.0,-22.0],[113.6,-24.5],[114.6,-28.5],[115.0,-31.5],[115.7,-33.5],[115.0,-34.5],[117.5,-35.0],[120.0,-33.9],[124.0,-33.0],[128.0,-32.0],[131.5,-31.5],[134.0,-32.5],[135.6,-34.8],[137.5,-35.6],[138.5,-35.6],[140.5,-38.0],[143.5,-38.8],[146.0,-39.0],[147.5,-38.0],[150.0,-37.5],[150.2,-35.8],[151.2,-33.9],[153.0,-31.0],[153.6,-28.2],[153.2,-25.5],[150.9,-22.9],[149.0,-21.0],[146.5,-19.0],[145.5,-16.5],[144.5,-14.5],[143.5,-12.0],[142.5,-10.7],[141.6,-12.7],[141.4,-15.5],[140.8,-17.5],[139.0,-17.6],[137.0,-16.0],[136.5,-14.0],[136.0,-12.2],[133.5,-11.5],[131.0,-12.2],[129.5,-14.5],[127.5,-14.0],[126.0,-14.5],[124.5,-16.0],[123.0,-17.0],[121.5,-19.0],[119.0,-20.0],[116.5,-20.7],[114.5,-21.7]];
const TAS = [[145.0,-40.8],[148.2,-40.9],[147.8,-43.2],[146.0,-43.5],[144.7,-41.3]];
const CITIES = [[151.2,-33.9], [145.0,-37.8], [153.0,-27.5]];   // Sydney, Melbourne, Brisbane
const MAP = () => ({ x: W * .56, y: H * .15, w: 760, h: 620 });
const geo = ([lon, lat]) => { const m = MAP(); return [m.x + (lon - 112) / 42 * m.w, m.y + (-lat - 10) / 34 * m.h]; };

// ===================== CARDS =====================
// Each card is (c, tau, i): plates first, lettering and crayon on top. tau = 99 gives the finished card for the gallery.
function cardTitle(c, tau, i) {
  usePalette('risoPop'); const dx = CX - 420, dy = CY + 30;
  risoCard(c, (g, k) => {
    if (k === 2) { glow(g, dx, dy - 40, 80, 640, .9); doorPath(g, dx, dy, 300, 540); g.fillStyle = '#fff'; g.fill(); }   // the door is knocked out of the glow so blue stays blue
    if (k === 0) { doorPath(g, dx, dy, 300, 540); g.fillStyle = gray(.6); g.fill(); doorPath(g, dx, dy, 226, 466); g.fillStyle = '#fff'; g.fill(); }
    if (k === 1) { doorPath(g, dx, dy, 226, 466); g.fillStyle = gray(.9); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(dx + 66, dy + 30, 14, 0, TAU); g.fill(); }
  }, { tau });
  hand(c, 'ADHDme', CX - 140, CY - 20, { size: 230 });
  hand(c, typed('The front door to', sm(2.4, 2.9, tau)), CX - 130, CY + 80, { size: 66, ink2: null }); hand(c, typed('ADHD care in Australia.', sm(2.8, 3.5, tau)), CX - 130, CY + 156, { size: 66, ink2: null });
}
function cardMaze(c, tau, i) {
  usePalette('risoPop'); const { s, cols, rows } = MZ, ox = (W - cols * s) / 2, oy = (H - rows * s) / 2;
  risoCard(c, (g, k) => {
    if (k === 2) glow(g, CX, CY, 100, 900, .8);
    if (k === 0) { g.fillStyle = gray(.6); const t = 12;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) { const px = ox + x * s, py = oy + y * s; if (MAZE.right[y * cols + x]) g.fillRect(px + s - t / 2, py - t / 2, t, s + t); if (MAZE.below[y * cols + x]) g.fillRect(px - t / 2, py + s - t / 2, s + t, t); }
      g.fillRect(ox - t / 2, oy - t / 2, cols * s + t, t); g.fillRect(ox - t / 2, oy - t / 2, t, rows * s + t);   // outer walls
      g.fillStyle = '#fff'; g.beginPath(); g.roundRect(CX - 700, CY - 190, 1400, 360, 40); g.fill(); }
    if (k === 1) { g.fillStyle = gray(.9); g.beginPath(); g.arc(ox + s / 2, oy + s / 2, 28, 0, TAU); g.fill(); doorPath(g, ox + (cols - .5) * s, oy + (rows - .5) * s + 8, 46, 74); g.fill(); }   // the patient at the entrance, the door at the far end
  }, { tau });
  head(c, 'Getting ADHD care', { y: CY - 60, size: 130, p: sm(0, .5, tau) }); head(c, 'is a maze.', { y: CY + 90, size: 130, p: sm(.45, .9, tau) });
}
function cardGiveUp(c, tau, i) {
  usePalette('risoPop'); const a = typed('So people give up', sm(0, .6, tau)), b = typed('before the first booking.', sm(.5, 1.1, tau));
  risoCard(c, (g, k) => { if (k === 1) { g.fillStyle = gray(.85); g.beginPath(); g.ellipse(CX, CY + 20, 620, 330, -.08, 0, TAU); g.fill(); ko(g, a, CX, CY - 40, 130); ko(g, b, CX, CY + 110, 100); } if (k === 2) glow(g, CX + 500, CY - 260, 40, 500, .7); }, { tau });
  hand(c, a, CX, CY - 40, { size: 130, align: 'center', ink2: null }); hand(c, b, CX, CY + 110, { size: 100, align: 'center', ink2: null });
}
function cardPain1(c, tau, i) {   // price opacity: a tag that swings, the amount a question
  usePalette('risoPop'); const sw = Math.sin(tau * 4) * .035;
  risoCard(c, (g, k) => {
    if (k === 2) glow(g, CX, CY, 100, 760, .6);
    g.save(); g.translate(CX - 232, -10); g.rotate(sw); g.translate(-(CX - 232), 10);
    if (k === 0) { g.fillStyle = gray(.7); g.fillRect(CX - 236, -10, 8, CY - 140); }
    if (k === 1) { g.fillStyle = gray(.85); g.beginPath(); g.moveTo(CX - 300, CY - 150); g.lineTo(CX + 150, CY - 150); g.lineTo(CX + 300, CY); g.lineTo(CX + 150, CY + 150); g.lineTo(CX - 300, CY + 150); g.closePath(); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(CX - 228, CY, 22, 0, TAU); g.fill(); ko(g, '$?', CX + 10, CY + 78, 220); }
    g.restore();
  }, { tau });
  label(c, 'Cost is hidden', sm(.1, .5, tau));
}
function cardPain2(c, tau, i) {   // wrong fit: a round peg comes down to a triangular hole and stops
  usePalette('risoPop'); const py = CY - 300 + 70 * sm(.1, .8, tau, easeOut);
  risoCard(c, (g, k) => {
    if (k === 2) { glow(g, CX, CY - 200, 60, 420, .8); g.fillStyle = '#fff'; g.beginPath(); g.arc(CX, py, 130, 0, TAU); g.fill(); }
    if (k === 1) { g.fillStyle = gray(.85); g.fillRect(CX - 200, CY - 40, 400, 360); g.fillStyle = '#fff'; g.beginPath(); g.moveTo(CX, CY + 40); g.lineTo(CX + 130, CY + 250); g.lineTo(CX - 130, CY + 250); g.closePath(); g.fill(); }
    if (k === 0) { g.fillStyle = gray(.9); g.beginPath(); g.arc(CX, py, 130, 0, TAU); g.fill(); }
  }, { tau });
  label(c, 'Wrong fit', sm(.1, .5, tau));
}
function cardPain3(c, tau, i) {   // three clinicians, three different answers, one sheet at a time
  usePalette('risoPop'); const shown = 1 + Math.min(2, Math.floor(tau * 12 / 4));
  risoCard(c, (g, k) => {
    for (let m = 0; m < shown; m++) { const x = CX - 560 + m * 400, y = CY - 250;
      if (k === 0) { g.fillStyle = gray(.22); g.fillRect(x, y, 320, 420); squiggleText(g, x + 30, y + 70, 260, 6 - m, { color: '#000', seed: 70 + m, lineH: 44 + m * 16, amp: 6 + m * 6, width: 5 }); }
      if (k === 1 && m === 1) { g.fillStyle = gray(.85); g.beginPath(); g.arc(x + 270, y + 50, 46, 0, TAU); g.fill(); }
      if (k === 2 && m === 2) { g.fillStyle = gray(.85); g.fillRect(x, y, 320, 70); }
    }
  }, { tau });
  label(c, 'No standard', sm(.1, .5, tau));
}
function cardPain4(c, tau, i) {   // scripts lapse at handover: the bottle drains, the alert is crossed out
  usePalette('risoPop'); const level = lerp(.75, .12, sm(.1, .9, tau));
  risoCard(c, (g, k) => {
    if (k === 2) { glow(g, CX - 200, CY + 40, 80, 520, .6); bellPath(g, CX + 300, CY - 40, 1.7); g.fillStyle = '#fff'; g.fill(); }
    if (k === 1) { g.fillStyle = gray(.85); g.beginPath(); g.roundRect(CX - 330, CY - 160, 260, 400, 30); g.fill(); g.fillRect(CX - 280, CY - 230, 160, 80); g.fillStyle = '#fff'; g.fillRect(CX - 305, CY - 135, 210, 300); g.fillStyle = gray(.85); g.fillRect(CX - 305, CY + 165 - 300 * level, 210, 300 * level); }
    if (k === 0) { bellPath(g, CX + 300, CY - 40, 1.7); g.fillStyle = gray(.8); g.fill(); g.beginPath(); g.arc(CX + 300, CY + 95, 24, 0, TAU); g.fill(); }
  }, { tau });
  const q = sm(.5, .9, tau, easeOut); if (q > 0) { c.strokeStyle = PAL.ink; c.lineWidth = 16; c.lineCap = 'round'; selfDraw(c, [[CX + 170, CY - 190], [CX + 430, CY + 110]], q, 75, 3); selfDraw(c, [[CX + 430, CY - 190], [CX + 170, CY + 110]], q, 76, 3); }
  label(c, 'Scripts lapse', sm(.1, .5, tau));
}
function cardWho(c, tau, i) {
  usePalette('risoPop'); const m = MAP();
  risoCard(c, (g, k) => {
    if (k === 2) { glow(g, m.x + m.w * .55, m.y + m.h * .5, 100, 620, .8); g.fillStyle = '#fff'; g.fill(polyPath(AUS.map(geo))); g.fill(polyPath(TAS.map(geo))); }
    if (k === 0) { g.fillStyle = gray(.6); g.fill(polyPath(AUS.map(geo))); g.fill(polyPath(TAS.map(geo))); }
    if (k === 1) CITIES.forEach((p, n) => { if (tau < 1.4 + n * .4) return; const [x, y] = geo(p); g.fillStyle = gray(.95); g.beginPath(); g.arc(x, y, 22, 0, TAU); g.fill(); });
  }, { tau });
  CITIES.forEach((p, n) => { const [x, y] = geo(p), q = sm(1.5 + n * .4, 1.9 + n * .4, tau, easeOut); if (q > 0) dashedRing(c, x, y, 26 + 34 * q, PAL.ink, 80 + n, [8, 6], 2.2); });
  hand(c, typed('16 to 25,', sm(0, .4, tau)), W * .06, CY - 70, { size: 120 }); hand(c, typed('seeking a diagnosis.', sm(.4, 1.0, tau)), W * .06, CY + 50, { size: 84 });
  if (tau >= 1.3) hand(c, 'Sydney · Melbourne · Brisbane', W * .06, CY + 150, { size: 50, ink2: null, ink: PAL.inks[0] });
}
function cardSolution(c, tau, i) {
  usePalette('risoPop'); const px = W * .28, py = CY + 40, cx = W * .74, cys = [-2, -1, 0, 1, 2].map(m => CY + 40 + m * 140), pick = 2;
  risoCard(c, (g, k) => {
    if (k === 2) { if (tau >= 2.6) glow(g, cx, cys[pick], 40, 300, .95); g.fillStyle = '#fff'; cys.forEach(y => { g.beginPath(); g.arc(cx, y, 44, 0, TAU); g.fill(); }); }
    if (k === 1) { g.fillStyle = gray(.9); g.beginPath(); g.arc(px, py, 74, 0, TAU); g.fill(); }
    if (k === 0) cys.forEach(y => { g.fillStyle = gray(.85); g.beginPath(); g.arc(cx, y, 44, 0, TAU); g.fill(); });
  }, { tau });
  c.save(); c.strokeStyle = PAL.ink; c.lineWidth = 1.8; c.globalAlpha = .4; c.lineCap = 'round'; cys.forEach((y, m) => { const q = sm(.7 + m * .2, 1.0 + m * .2, tau); if (q > 0) selfDraw(c, [[px + 80, py], [cx - 54, y]], q, 90 + m, 2); }); c.restore();
  const q = sm(2.0, 2.7, tau, easeOut); if (q > 0) { c.strokeStyle = PAL.accents[0]; c.lineWidth = 7; c.lineCap = 'round'; selfDraw(c, [[px + 80, py], [(px + cx) / 2, py - 10], [cx - 58, cys[pick]]], q, 96, 3); if (q >= 1) dashedRing(c, cx, cys[pick], 78, PAL.accents[0], 97, [10, 7], 3); }
  head(c, 'Matching, not triage.', { p: sm(0, .6, tau) });
  sub(c, 'Not the next free slot. The right person.', { p: sm(3.0, 3.7, tau) });
}
// pairs of life experience: what the patient brings, what the clinician brings. Cross-matched, so it reads as a match, not a list.
const PAIRS = [
  ['new parent, postpartum', 'perinatal experience', 2],
  ['South Asian family, stigma at home', 'same background · Hindi and Urdu', 0],
  ['afraid of being judged', 'plain language, no judgement', 1],
];
function cardPsycho(c, tau, i) {
  usePalette('risoPop'); const rows = [CY - 150, CY + 10, CY + 170], lx = W * .27, rx = W * .73, lw = 640, rw = 640, hh = 104;
  const t0 = n => 1.0 + n * 1.6;
  risoCard(c, (g, k) => {
    if (k === 2) PAIRS.forEach(([, , to], n) => { if (tau >= t0(n) + 1.0) glow(g, rx, rows[to], 60, 360, .9); });   // the glow first, then every chip is knocked out of it
    PAIRS.forEach(([, , to], n) => { if (tau < t0(n)) return;
      if (k === 1) { g.fillStyle = gray(.3); pill(g, lx, rows[n], lw, hh); }
      if (k === 0) { g.fillStyle = gray(.3); pill(g, rx, rows[to], rw, hh); }
      if (k === 2) { g.fillStyle = '#fff'; pill(g, rx, rows[to], rw + 24, hh + 24); }
    });

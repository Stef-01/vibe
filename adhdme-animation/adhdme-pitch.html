<!doctype html>

<title>ADHDme: the pitch</title>
<style>

  @font-face { font-family: "Bradley Hand"; src: url("fonts/CaveatBrush-Regular.ttf"); }
  @font-face { font-family: "Noto Devanagari"; src: url("fonts/NotoSansDevanagari[wdth,wght].ttf"); font-weight: 100 900; }

  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(92vw,960px);height:auto;background:#000;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="core.js"></script>
<script src="adhdme-pitch-voice.js"></script>
<script>
'use strict';
// ============================================================
// ADHDme, the pitch: a narrated, riso-printed startup pitch drawn frame by frame on Canvas 2D on top
// of core.js (hand-drawn-canvas-animation skill). No images, no libraries, no Math.random.
// ============================================================

// ===================== BRIEF & BEAT SHEET =====================
// BRIEF
// Subject: ADHDme as a YC-style pitch with a narrator: hook, problem, who, solution, three matches on
//          life experience shown as faces, how, why now, market, business model, traction, close. Content
//          from the Value Proposition Canvas with market numbers and traction from the strategic plan deck.
// Format: 16:9, output width 1920, drawn 12 fps, output 24 fps. Length follows the narration: every beat
//         lasts max(its visual minimum, lead + speech + pad), computed by voice.py into adhdme-pitch-voice.js.
//         With the current script that is about 118 seconds.
// Look:   riso throughout: cream stock, fluorescent inks printed as halftone plates with knockouts, each
//         card's plates arriving in print order. Portraits are drawn: skin, hair and clothes as flat fills
//         under a riso dot screen, features in navy line. Crayon ripples, an iris, a card montage, a badge
//         gallery, one duotone beat, one starfield.
// Palette: risoPop (blue, pink, yellow, navy). Skin tones and clothes are tints and shades of its fills.
// Anchor: the seed dot, navy with a pink offset, at the bottom centre of every frame.
// Puppets: bust(): head, hair, shoulders, a face with mood and brows, glasses, beard, bindi, a baby held,
//          a raised hand, a stethoscope, a badge, a bilingual name label. Three patients, three clinicians,
//          and the faceless figures around them (a family, a crowd).
// Sound:  voice.py narrates each beat with piper; score() writes the music from the same timeline: pads
//         on a I V vi IV loop, a bass, a plucked arpeggio from the solution on, soft drums through the
//         middle, accents on the cuts; build-pitch.sh ducks the music under the voice.
//
// beat       look        what changes                                                          kit                          sound
// hook       riso        ripples from the dot; an iris opens on the title card                  crayon iris plates           pads in, rising note
// maze       riso        a real maze, the headline knocked out of it                            plates knockouts             minor loop
// pain1..4   riso        a swinging tag, a peg on the wrong hole, three sheets, a draining bottle plates selfDraw              a square per cut
// giveup     riso        "so people give up before the first booking"                           plates ko                    low sine
// who        riso        Australia prints in, three cities ring one by one                      plates dashedRing            major loop begins
// solution   riso        patient dot, five clinicians, the fit lights up                        plates crayon selfDraw       arpeggio in
// pair1..3   riso        a patient and a clinician face each other; the life around the patient  bust plates bubble crayon    a two-note ding per match
//                        (a pram and a night moon; a home and a family; a crowd); the line lands
// pairs      riso        the three pairs as small portraits, cross-matched                        bust crayon                  hold
// how1..3    riso        cost bands, diagnosis templates, script alerts                          plates selfDraw              drums in
// whynow     starfield   timeline: QLD live, NSW and VIC 2026, asters ignite                     night grain aster            sawtooth swell
// market     riso        >1M pops, 250K counts up while a quarter of the crowd turns pink        plates hand                  accent
// model      duotone     patient, door, clinician in two inks; free for patients                 duotone plates crayon        drums out
// traction   riso        three stamps land with a tilt                                           plates dashedRing            three rising notes
// gallery    riso        every card as a badge, collapsing into the dot                          badges                       pads only
// close      riso        the tagline types out over ripples                                      crayon hand                  resolve
// signoff    riso        ADHDme / adhdme.au, two dots                                            signOff                      last chord

// ===================== TIMELINE FROM THE NARRATION =====================
// adhdme-pitch-voice.js (from voice.py) gives BEATS = [{id, start, dur, speech}]. Without it, these minimums apply.
const FALLBACK = [['hook', 5], ['maze', 3], ['pain1', 3], ['pain2', 3], ['pain3', 3], ['pain4', 3], ['giveup', 3], ['who', 5], ['solution', 5], ['pair1', 5.5], ['pair2', 5.5], ['pair3', 5.5], ['pairs', 4], ['how1', 4], ['how2', 4], ['how3', 4], ['whynow', 6], ['market', 6], ['model', 5], ['traction', 5], ['gallery', 3.5], ['close', 4.5], ['signoff', 3.5]];
const B = (() => { const list = typeof BEATS !== 'undefined' ? BEATS : (() => { let t = 0; return FALLBACK.map(([id, dur]) => { const b = { id, start: t, dur, speech: 0 }; t += dur; return b; }); })(); return Object.fromEntries(list.map(b => [b.id, b])); })();
const D = id => B[id].dur;
function beatAt(ids, tau) { let acc = 0; for (const id of ids) { if (tau < acc + D(id)) return [id, tau - acc]; acc += D(id); } const id = ids[ids.length - 1]; return [id, tau - (acc - D(id))]; }

// ===================== PALETTE =====================
usePalette('risoPop');
const DUO = makePalette({ paperBand: null }, duotone(PALETTES.risoPop.inks[1], PALETTES.risoPop.inks[0]));   // pink and blue, the flipbook's two-ink beat, on plain stock
const ANCHOR = () => [CX, H * .905];
const SKIN = () => ({ light: tint(PAL.fills[4], .66), mid: tint(PAL.fills[4], .34), tan: shade(tint(PAL.fills[4], .18), .18), deep: shade(PAL.fills[4], .5) });

// ===================== HELPERS =====================
// hand lettering in two inks (Caveat Brush is a single weight); `font` swaps the face for other scripts
function hand(c, text, x, y, o = {}) {
  const { size = 48, ink = PAL.ink, ink2 = PAL.accents[0], offset = 4, align = 'left', al = 1, font = HAND_FONT } = o;
  if (!text) return;
  c.save(); c.font = `${size}px ${font}`; c.textAlign = align; c.textBaseline = 'alphabetic';
  if (ink2) { c.fillStyle = ink2; c.globalAlpha = .85 * al; c.fillText(text, x + offset, y + offset * .6); }
  c.fillStyle = ink; c.globalAlpha = al; c.fillText(text, x, y); c.restore();
}
// a run of texts in different faces, centred as one line: parts = [[text, font, sizeScale]]
function mixed(c, parts, x, y, size, o = {}) {
  c.save(); const widths = parts.map(([t, f, k = 1]) => { c.font = `${size * k}px ${f || HAND_FONT}`; return c.measureText(t).width; }); const total = widths.reduce((a, b) => a + b, 0);
  let px = x - total / 2; parts.forEach(([t, f, k = 1], n) => { hand(c, t, px, y, { ...o, size: size * k, align: 'left', font: f || HAND_FONT }); px += widths[n]; }); c.restore();
}
const typed = (text, p) => text.slice(0, Math.round(text.length * clamp(p, 0, 1)));
const head = (c, text, o = {}) => hand(c, typed(text, o.p ?? 1), CX, o.y ?? H * .17, { size: 100, align: 'center', ...o });
const sub = (c, text, o = {}) => hand(c, typed(text, o.p ?? 1), CX, o.y ?? H * .86, { size: 50, align: 'center', ink2: null, ...o });
const label = (c, text, p = 1) => hand(c, typed(text, p), CX, H * .83, { size: 84, align: 'center' });
const blinkAt = (i, off = 0) => pulse(i + off, 11) ? 1 : 0;
function mark(c, onNight = false) { resetT(c); const [x, y] = ANCHOR(); seedDot(c, x, y, 11, onNight ? PAL.chalk : PAL.ink, PAL.accents[0]); }
// riso printing: three reusable plates, coverage drawn in black on white, white is a knockout.
// Plates arrive in print order over the first third of a second of a card: yellow, then blue, then pink.
const PLATES = [layer(), layer(), layer()], ARRIVAL = [2 / 12, 4 / 12, 0];
function risoCard(c, draw, o = {}) {
  const inks = o.inks || PAL.inks.slice(0, 3), angles = o.angles || [.26, 1.31, 0], cell = o.cell || 7, tau = o.tau ?? 99; paper(c);
  inks.forEach((ink, k) => { if (tau < (inks.length === 3 ? ARRIVAL[k] : k * 2 / 12)) return;
    const P = PLATES[k], g = P.getContext('2d'); resetT(g); g.globalAlpha = 1; g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.fillStyle = '#000'; g.strokeStyle = '#000'; g.lineWidth = 6; g.lineCap = 'round'; draw(g, k); printPlate(c, P, { cell, ink, angle: angles[k], seed: 30 + k }); });
}
const gray = v => `rgb(${255 - v * 255 | 0},${255 - v * 255 | 0},${255 - v * 255 | 0})`;   // plate coverage 0..1 -> grey
const radial = (g, x, y, r0, r1, c0, c1) => { const gr = g.createRadialGradient(x, y, r0, x, y, r1); gr.addColorStop(0, c0); gr.addColorStop(1, c1); return gr; };
function glow(g, x, y, r0, r1, v) { g.fillStyle = radial(g, x, y, r0, r1, gray(v), gray(0)); g.fillRect(0, 0, W, H); }
function ko(g, text, x, y, size, align = 'center') { g.save(); g.font = `${size}px ${HAND_FONT}`; g.textAlign = align; g.fillStyle = '#fff'; g.fillText(text, x, y); g.restore(); }   // knockout lettering
function pill(g, x, y, w, h) { g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, h / 2); g.fill(); }
function doorPath(g, cx, cy, w, h) { g.beginPath(); g.moveTo(cx - w / 2, cy + h / 2); g.lineTo(cx - w / 2, cy - h / 2 + w / 2); g.arc(cx, cy - h / 2 + w / 2, w / 2, Math.PI, 0); g.lineTo(cx + w / 2, cy + h / 2); g.closePath(); }
function bellPath(g, x, y, s) { g.beginPath(); g.moveTo(x - 70 * s, y + 40 * s); g.quadraticCurveTo(x - 70 * s, y - 60 * s, x, y - 72 * s); g.quadraticCurveTo(x + 70 * s, y - 60 * s, x + 70 * s, y + 40 * s); g.lineTo(x + 92 * s, y + 62 * s); g.lineTo(x - 92 * s, y + 62 * s); g.closePath(); }
function tagPath(g, x, y, s) { g.beginPath(); g.moveTo(x - 48 * s, y - 30 * s); g.lineTo(x + 14 * s, y - 30 * s); g.lineTo(x + 50 * s, y); g.lineTo(x + 14 * s, y + 30 * s); g.lineTo(x - 48 * s, y + 30 * s); g.closePath(); }
const heartPts = (cx, cy, k, n = 40) => Array.from({ length: n }, (_, j) => { const t = j / n * TAU; return [cx + 16 * Math.pow(Math.sin(t), 3) * k, cy - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * k + 3 * k]; });
const arcPts = (cx, cy, rx, ry, a0, a1, n = 30) => Array.from({ length: n + 1 }, (_, k) => { const a = a0 + (a1 - a0) * k / n; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });
const halfPath = (cx, cy, rx, ry, top = true) => { const p = new Path2D(); p.ellipse(cx, cy, rx, ry, 0, top ? Math.PI : 0, top ? TAU : Math.PI); p.closePath(); return p; };
// a thought or speech bubble with a drawing inside, and the trail of circles or the tail to whoever says it
function bubble(c, x, y, rx, ry, seed, draw, q = 1) {
  if (q <= 0) return; c.save(); c.translate(x, y); c.scale(q, q);
  const p = ellPath(0, 0, rx, ry); c.fillStyle = PAL.light; c.fill(p); surface(c, p, [-rx, -ry, 2 * rx, 2 * ry], { finish: 'riso', seed, density: .1, cell: 8, color: PAL.inks[2], alpha: .8 });
  c.strokeStyle = PAL.ink; c.lineWidth = 2.6; wob(c, ellPts(0, 0, rx, ry, 0, 60), 2, seed + 1, true);
  if (draw) draw(c); c.restore();
}
function bubbleTrail(c, from, to, seed, q) {
  for (let k = 0; k < 3; k++) { const u = (k + 1) / 4, qq = sm(k * .12, k * .12 + .2, q); if (qq <= 0) continue; const x = lerp(from[0], to[0], u), y = lerp(from[1], to[1], u), r = (8 + k * 6) * qq;
    c.fillStyle = PAL.light; c.fill(circPath(x, y, r)); c.strokeStyle = PAL.ink; c.lineWidth = 2.2; wob(c, ellPts(x, y, r, r, 0, 16), 1.2, seed + k, true); }
}
function tail(c, from, to, seed) { c.strokeStyle = PAL.ink; c.lineWidth = 2.6; c.fillStyle = PAL.light; const p = polyPath([from, [to[0] - 14, to[1]], [to[0] + 14, to[1]]]); c.fill(p); wob(c, [[to[0] - 14, to[1]], from, [to[0] + 14, to[1]]], 1.2, seed); }
// a real maze (recursive backtracker, seeded) for the problem card
const MZ = { s: 110, cols: 19, rows: 11 };
const MAZE = (() => { const { cols, rows } = MZ, r = rng(55), vis = Array(cols * rows).fill(false), right = Array(cols * rows).fill(true), below = Array(cols * rows).fill(true), stack = [[0, 0]]; vis[0] = true;
  while (stack.length) { const [x, y] = stack[stack.length - 1], nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [x + dx, y + dy, dx, dy]).filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < cols && ny < rows && !vis[ny * cols + nx]);
    if (!nb.length) { stack.pop(); continue; } const [nx, ny, dx, dy] = nb[r() * nb.length | 0];
    if (dx === 1) right[y * cols + x] = false; if (dx === -1) right[ny * cols + nx] = false; if (dy === 1) below[y * cols + x] = false; if (dy === -1) below[ny * cols + nx] = false; vis[ny * cols + nx] = true; stack.push([nx, ny]); }
  return { right, below }; })();
// a rough Australia, lon/lat, for the segment card
const AUS = [[114.0,-22.0],[113.6,-24.5],[114.6,-28.5],[115.0,-31.5],[115.7,-33.5],[115.0,-34.5],[117.5,-35.0],[120.0,-33.9],[124.0,-33.0],[128.0,-32.0],[131.5,-31.5],[134.0,-32.5],[135.6,-34.8],[137.5,-35.6],[138.5,-35.6],[140.5,-38.0],[143.5,-38.8],[146.0,-39.0],[147.5,-38.0],[150.0,-37.5],[150.2,-35.8],[151.2,-33.9],[153.0,-31.0],[153.6,-28.2],[153.2,-25.5],[150.9,-22.9],[149.0,-21.0],[146.5,-19.0],[145.5,-16.5],[144.5,-14.5],[143.5,-12.0],[142.5,-10.7],[141.6,-12.7],[141.4,-15.5],[140.8,-17.5],[139.0,-17.6],[137.0,-16.0],[136.5,-14.0],[136.0,-12.2],[133.5,-11.5],[131.0,-12.2],[129.5,-14.5],[127.5,-14.0],[126.0,-14.5],[124.5,-16.0],[123.0,-17.0],[121.5,-19.0],[119.0,-20.0],[116.5,-20.7],[114.5,-21.7]];
const TAS = [[145.0,-40.8],[148.2,-40.9],[147.8,-43.2],[146.0,-43.5],[144.7,-41.3]];
const CITIES = [[151.2,-33.9], [145.0,-37.8], [153.0,-27.5]];   // Sydney, Melbourne, Brisbane
const MAP = () => ({ x: W * .56, y: H * .15, w: 760, h: 620 });
const geo = ([lon, lat]) => { const m = MAP(); return [m.x + (lon - 112) / 42 * m.w, m.y + (-lat - 10) / 34 * m.h]; };

// ===================== PUPPET: A PORTRAIT =====================
// bust(c, x, y, s, look, pose, seed): origin at the base of the neck, about 330 px tall at scale 1.
// look: { skin, hair, top, style: crop|short|bun|curly|long|hood|none, coat, steth, glasses, beard, bindi, tired, baby, wave, badge, tag, faceless }
// pose: { mood -1..1 (frown..smile), brow -1..1 (worried..friendly), blink }
function bust(c, x, y, s, look, pose = {}, seed = 400) {
  const line = PAL.ink, mood = pose.mood || 0, brow = pose.brow || 0;
  c.save(); c.translate(x, y); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  const part = (path, pts, box, fill, sd, o = {}) => { c.fillStyle = fill; c.fill(path); surface(c, path, box, { finish: 'riso', seed: seed + sd, density: o.density ?? .26, cell: o.cell ?? 6, color: o.color || PAL.inks[1], alpha: .75 }); if (o.outline !== false) { c.strokeStyle = line; c.lineWidth = o.lw ?? 2.8; wob(c, pts, 1.6, seed + sd + 1, true); } };
  if (look.style === 'long') for (const sg of [-1, 1]) { const pts = [[sg * 56, -136], [sg * 76, -60], [sg * 88, 40], [sg * 44, 30], [sg * 44, -70]]; part(polyPath(pts), pts, [-90, -140, 180, 190], look.hair, 10 + sg, { color: PAL.inks[0], density: .55 }); }
  if (look.style === 'hood') part(ellPath(0, -98, 96, 108), ellPts(0, -98, 96, 108, 0, 60), [-96, -206, 192, 216], look.top, 14, { color: PAL.inks[0], density: .3 });
  const sh = [[-104, 8], [-70, -6], [70, -6], [104, 8], [150, 150], [-150, 150]]; part(polyPath(sh), sh, [-150, -6, 300, 156], look.top, 20, { color: look.coat ? PAL.inks[0] : PAL.inks[1], density: look.coat ? .1 : .3 });
  if (look.coat) { c.strokeStyle = line; c.lineWidth = 2; wob(c, [[-42, -6], [-18, 34], [-14, 150]], 1.2, seed + 22); wob(c, [[42, -6], [18, 34], [14, 150]], 1.2, seed + 23); }
  part(rectPath(-22, -42, 44, 48), [[-22, -42], [22, -42], [22, 6], [-22, 6]], [-22, -42, 44, 48], look.skin, 30, { density: .18, outline: false });
  part(ellPath(0, -104, 62, 72), ellPts(0, -104, 62, 72, 0, 60), [-62, -176, 124, 144], look.skin, 32, { density: .18 });
  if (['crop', 'short', 'bun', 'curly', 'long'].includes(look.style)) part(halfPath(0, -118, 66, 58), arcPts(0, -118, 66, 58, Math.PI, TAU), [-66, -176, 132, 60], look.hair, 40, { color: PAL.inks[0], density: .55 });
  if (look.style === 'bun') part(circPath(30, -174, 22), ellPts(30, -174, 22, 22, 0, 20), [8, -196, 44, 44], look.hair, 44, { color: PAL.inks[0], density: .55 });
  if (look.style === 'curly') for (let k = -3; k <= 3; k++) part(circPath(k * 20, -168 + Math.abs(k) * 7, 16), ellPts(k * 20, -168 + Math.abs(k) * 7, 16, 16, 0, 16), [k * 20 - 16, -184, 32, 32], look.hair, 46 + k + 3, { color: PAL.inks[0], density: .55 });
  if (look.style === 'hood') { c.strokeStyle = line; c.lineWidth = 2.4; wob(c, arcPts(0, -110, 58, 50, Math.PI * 1.12, Math.PI * 1.88), 1.4, seed + 48); }
  if (look.beard) { c.save(); c.clip(ellPath(0, -104, 62, 72)); part(halfPath(0, -84, 48, 36, false), arcPts(0, -84, 48, 36, 0, Math.PI), [-48, -84, 96, 40], look.hair, 50, { color: PAL.inks[0], density: .5 }); c.restore(); }
  if (!look.faceless) {
    c.strokeStyle = line; c.fillStyle = line; c.lineWidth = 2.4;
    for (const sg of [-1, 1]) { const ex = sg * 24, ey = -108;
      if (pose.blink) { c.beginPath(); c.moveTo(ex - 6, ey); c.lineTo(ex + 6, ey); c.stroke(); } else { c.beginPath(); c.arc(ex, ey, 4.2, 0, TAU); c.fill(); }
      wob(c, [[sg * 40, -134 - Math.max(0, brow) * 6], [sg * 10, -134 - Math.max(0, -brow) * 9]], .8, seed + 60 + sg);
      if (look.tired) { c.lineWidth = 1.5; wob(c, [[ex - 8, ey + 12], [ex, ey + 15], [ex + 8, ey + 12]], .6, seed + 64 + sg); c.lineWidth = 2.4; }
      if (look.glasses) { c.lineWidth = 2.2; wob(c, ellPts(ex, ey, 18, 15, 0, 20), 1, seed + 66 + sg, true); c.lineWidth = 2.4; } }
    if (look.glasses) { c.beginPath(); c.moveTo(-6, -108); c.lineTo(6, -108); c.stroke(); }
    if (look.bindi) { c.fillStyle = PAL.accents[0]; c.beginPath(); c.arc(0, -142, 4.5, 0, TAU); c.fill(); }
    c.strokeStyle = look.beard ? PAL.paper : line; c.lineWidth = look.beard ? 3.2 : 2.6; c.beginPath(); c.moveTo(-18, -72); c.quadraticCurveTo(0, -72 + mood * 16, 18, -72); c.stroke();   // a smile shows through a beard in paper colour
    c.lineWidth = 1.8; wob(c, [[2, -100], [8, -86], [0, -84]], .6, seed + 70);

  if (look.steth) { c.strokeStyle = PAL.inks[0]; c.lineWidth = 3; wob(c, [[-30, -4], [-44, 46], [-16, 88], [14, 96]], 1.2, seed + 72); c.fillStyle = PAL.inks[0]; c.beginPath(); c.arc(20, 98, 11, 0, TAU); c.fill(); c.strokeStyle = line; c.lineWidth = 2; wob(c, ellPts(20, 98, 11, 11, 0, 14), .8, seed + 73, true); }
  if (look.badge) { part(circPath(-72, 62, 24), ellPts(-72, 62, 24, 24, 0, 18), [-96, 38, 48, 48], PAL.fills[2], 80, { density: .2, color: PAL.inks[1] }); c.strokeStyle = PAL.accents[0]; c.lineWidth = 2.2; wob(c, heartPts(-72, 62, .62), 1, seed + 82, true); }
  if (look.baby) {   // held on the right shoulder, asleep
    c.strokeStyle = line; c.lineWidth = 27; wob(c, [[-30, 56], [60, 100], [118, 76]], 1, seed + 90); c.strokeStyle = look.skin; c.lineWidth = 21; wob(c, [[-30, 56], [60, 100], [118, 76]], 1, seed + 90);
    part(ellPath(84, 40, 36, 60, .6), ellPts(84, 40, 36, 60, .6, 40), [40, -30, 100, 140], tint(PAL.fills[3], .45), 92, { density: .2, color: PAL.inks[0] });
    part(circPath(106, -12, 25), ellPts(106, -12, 25, 25, 0, 24), [81, -37, 50, 50], SKIN().light, 94, { density: .15 });
    part(halfPath(106, -22, 26, 18), arcPts(106, -22, 26, 18, Math.PI, TAU), [80, -40, 52, 20], tint(PAL.fills[2], .3), 96, { density: .2 });
    c.strokeStyle = line; c.lineWidth = 1.8; wob(c, [[96, -8], [102, -6]], .5, seed + 97); wob(c, [[110, -6], [116, -8]], .5, seed + 98); wob(c, [[103, 2], [109, 3]], .5, seed + 99);

const CARDS = [cardTitle, cardPain1, cardPain2, cardPain3, cardPain4, cardWho, cardSolution, (c, t, i) => cardPair(0, c, t, i), (c, t, i) => cardPair(1, c, t, i), (c, t, i) => cardPair(2, c, t, i), cardPairs, cardHow1, cardHow2, cardHow3, cardWhyNow, cardMarket, cardModel, cardTraction];

// ===================== SCENES =====================

// ===================== FILM =====================
const SCENES = [
  ['hook', ['hook'], sceneHook], ['problem', PROBLEM, sceneProblem], ['who', ['who'], sceneWho], ['solution', ['solution'], sceneSolution],
  ['matching', MATCH, sceneMatching], ['how', HOW, sceneHow], ['whynow', ['whynow'], sceneWhyNow], ['market', ['market'], sceneMarket],

];
const TIMELINE = SCENES.map(([name, ids, fn]) => ({ name, dur: ids.reduce((a, id) => a + D(id), 0), fn }));
const T = { end: TIMELINE.reduce((a, s) => a + s.dur, 0) };

// ===================== SCORE: THE MUSIC =====================
// Written from the same timeline: pads on a chord loop, a bass, a plucked arpeggio from the solution on, soft drums
// through the middle, accents on the cuts. build-pitch.sh ducks it under the narration.
function score(ac, t0, dest) {
  const master = ac.createGain(); master.gain.value = .5; master.connect(dest);
  const irN = Math.ceil(ac.sampleRate * 2.4), ir = ac.createBuffer(2, irN, ac.sampleRate), rr = rng(99);

  const bass = (m, t, d, g) => pluck(m - 24, t, d, g, 'sine', bassBus);
  const kick = (t, g) => { const o = ac.createOscillator(), e = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(120, t0 + t); o.frequency.exponentialRampToValueAtTime(44, t0 + t + .12); e.gain.setValueAtTime(g, t0 + t); e.gain.exponentialRampToValueAtTime(.0008, t0 + t + .3); o.connect(e); e.connect(drumBus); o.start(t0 + t); o.stop(t0 + t + .32); };

    bass(root, t, beat * 1.7, .2); bass(root, t + beat * 2, beat * 1.7, .14); if (n % 2) bass(root + 7, t + beat * 3.5, beat * .5, .1);
    if (t >= B.solution.start - .2 && t < B.close.start) [ch[0], ch[2], ch[1] + 12, ch[0] + 12, ch[2], ch[1] + 12, ch[0] + 12, ch[2] + 12].forEach((m, k) => pluck(m, t + k * beat / 2, .4, t < B.pair1.start ? .035 : .05));
    if (t >= B.how1.start - .2 && t < B.traction.start) { kick(t, .55); kick(t + beat * 2, .4); kick(t + beat * 2.5, .25); for (let k = 0; k < 4; k++) hat(t + k * beat + beat / 2, .05); }
  }

  ['pain1', 'pain2', 'pain3', 'pain4'].forEach((id, k) => pluck(69 + [0, 2, 4, 7][k], B[id].start, .35, .08, 'square'));

  pluck(84, B.solution.start + D('solution') * .45 + .8, 1.0, .16, 'sine');
  ['pair1', 'pair2', 'pair3'].forEach(id => { const t = B[id].start + D(id) * .42 + .8; pluck(84, t, .9, .16, 'sine'); pluck(91, t + .18, 1.2, .12, 'sine'); });
  pluck(96, B.market.start + .5, 1.4, .14, 'sine'); pluck(88, B.market.start + D('market') * .45, 1.2, .12, 'sine');
  [0, 1, 2].forEach(k => pluck(72 + [0, 4, 7][k], B.traction.start + D('traction') * (.15 + k * .2), 1.0, .16, 'triangle'));

}

Promise.all(['40px "Bradley Hand"', '40px "Noto Devanagari"', '40px "Noto Urdu"'].map(f => document.fonts.load(f).catch(() => {}))).then(() =>
